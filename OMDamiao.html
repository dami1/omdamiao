<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMDamião</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen&family=Noto+Music&display=swap" rel="stylesheet"></head><body><title>OMDamião</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&family=Noto+Music&display=swap">
<style>
/* Layout: desktop GEM (Atari ST) — barra de menus no topo, janelas-nó arrastáveis sobre a mesa, cabos entre portas.
   Mundo visual único e deliberado; os temas trocam só a tinta, o papel e a mesa. A pauta é sempre preto sobre branco. */
:root {
  --ink: #000000;
  --paper: #ffffff;
  --desk: #161616;
  --wire: #d9d9d9;   /* cabos sobre a mesa escura */
  --line: #000000;
  --shadow: #000000;
  --backdrop: rgba(0, 0, 0, .6);
  --frame: 2px solid var(--line);
  --ui: "VT323", "Silkscreen", ui-monospace, "Courier New", monospace;
  --pix: "Silkscreen", "VT323", ui-monospace, monospace;
  --music: "Noto Music", "Segoe UI Symbol", serif;
  --dither: repeating-conic-gradient(var(--ink) 0 25%, transparent 0 50%) 0 0 / 2px 2px;
  color-scheme: light;
}
:root[data-gem="green"] { --wire: #34ff6a; --ink: #34ff6a; --paper: #02160b; --desk: #010c05; --line: #27c451; --shadow: #0a361b; --backdrop: rgba(0,25,5,.6); color-scheme: dark; }
:root[data-gem="amber"] { --wire: #ffb22e; --ink: #ffb22e; --paper: #190f00; --desk: #0c0700; --line: #cf8c18; --shadow: #4a3208; --backdrop: rgba(25,12,0,.6); color-scheme: dark; }
:root[data-gem="c64"]   { --wire: #b1a7ff; --ink: #b1a7ff; --paper: #4034a8; --desk: #2c2382; --line: #b1a7ff; --shadow: #241c63; --backdrop: rgba(20,10,60,.6); color-scheme: dark; }
* { box-sizing: border-box; }
html { background: var(--desk); }
body { background: var(--desk); color: var(--ink); font: 18px/1.15 var(--ui); margin: 0; }
button, input, select, textarea { font: inherit; color: var(--ink); }
/* A aplicação tem altura própria: não depende da altura do html/body do visualizador. */
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: 620px; background: var(--desk); }

/* barra de menus (como no cdp-web: marca, menus, espaço, status) */
.menubar { position: relative; z-index: 9000; flex: none; display: flex; align-items: stretch; background: var(--paper); border-bottom: var(--frame); min-height: 36px; user-select: none; overflow: hidden; }
.menubar > button, .menubar > span { font: inherit; background: none; color: var(--ink); border: 0; border-radius: 0; margin: 0; padding: 6px 13px; flex: none; white-space: nowrap; display: flex; align-items: center; }
.menubar > button { cursor: pointer; }
.menubar > button:hover, .menubar > button.open, .menubar > button:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
.menubar .spacer { flex: 1; min-width: 0; padding: 0; }
.menubar .cell { border-left: var(--frame); }
.menubar .brand-cell { padding: 0 10px 0 12px; }
.brandmark { width: 22px; height: 18px; display: block; }
.brandmark path, .brandmark rect { fill: var(--ink); }
.menubar > button:hover .brandmark rect, .menubar > button.open .brandmark rect { fill: var(--paper); }
.mobile-toggle, .mobile-title { display: none !important; }
@media (max-width: 760px) {
  .menubar .desk-menu, .menubar .brand-cell, .menubar .spacer, .menubar #stat { display: none !important; }
  .mobile-toggle { display: flex !important; justify-content: center; width: 52px; border-right: var(--frame) !important; }
  .mobile-title { display: flex !important; flex: 1 !important; min-width: 0; letter-spacing: 1px; text-transform: uppercase; }
}

/* menus GEM */
.gem-menu { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; position: fixed; z-index: 9800; min-width: 230px; max-width: calc(100vw - 16px); max-height: 72vh; overflow-y: auto; background: var(--paper); color: var(--ink); border: var(--frame); box-shadow: 4px 4px 0 var(--shadow); padding: 0; }
.gem-menu .opt { display: flex; justify-content: space-between; align-items: center; gap: 22px; width: 100%; padding: 4px 14px; border: 0; background: none; text-align: left; cursor: pointer; white-space: nowrap; font: inherit; color: var(--ink); }
.gem-menu .opt:hover, .gem-menu .opt:focus-visible, .gem-menu .opt.cur { background: var(--ink); color: var(--paper); outline: none; }
.gem-menu .opt .k, .gem-menu .opt .arr { opacity: .7; }
.gem-menu .opt[aria-checked="true"] .lbl::before { content: "✓ "; }
.gem-menu .opt[aria-checked="false"] .lbl::before { content: "\00a0\00a0 "; }
.gem-menu .grp { padding: 5px 12px 3px; border-bottom: var(--frame); letter-spacing: 1px; text-transform: uppercase; font-size: 16px; }
.gem-menu .grp:not(:first-child) { border-top: var(--frame); }
.gem-menu .menusep { border-top: var(--frame); margin: 3px 0; }
/* painel do menu no celular (desk menu) */
.desk-panel { position: fixed; z-index: 9800; left: 0; right: 0; background: var(--paper); border-bottom: var(--frame); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.desk-panel .sec > button.head { display: flex; justify-content: space-between; width: 100%; padding: 9px 16px; border: 0; border-bottom: var(--frame); background: var(--paper); color: var(--ink); font: inherit; text-align: left; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
.desk-panel .sec > button.head[aria-expanded="true"] { background: var(--ink); color: var(--paper); }
.desk-panel .items { border-bottom: var(--frame); padding: 4px 0; }
.desk-panel .opt { display: flex; justify-content: space-between; gap: 16px; width: 100%; padding: 7px 16px 7px 26px; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.desk-panel .opt:hover, .desk-panel .opt:active { background: var(--ink); color: var(--paper); }
.desk-panel .opt[aria-checked="true"] .lbl::before { content: "✓ "; }
.desk-panel .grp { padding: 6px 16px 2px 26px; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; opacity: .75; }
.desk-panel .sub { padding-left: 14px; }

/* mesa */
#desktop { position: relative; flex: 1; min-height: 0; width: 100%; overflow: auto; touch-action: pan-x pan-y; }
#canvas { position: relative; width: 2600px; height: 1700px; }
#content { position: absolute; left: 0; top: 0; width: 2600px; height: 1700px; transform-origin: 0 0; }
.menubar .zbtn { min-width: 40px; justify-content: center; font-variant-numeric: tabular-nums; }
#zReset { min-width: 62px; }
#cables { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; overflow: visible; }
#cables .cable { fill: none; stroke: var(--wire); stroke-width: 2; pointer-events: stroke; cursor: pointer; }
#cables .cable.rc { stroke-dasharray: 9 3 2 3; stroke-width: 2.2; }
#cables .cable.num { stroke-dasharray: 1.5 3.5; stroke-linecap: round; stroke-width: 2.4; }
#cables .cable:hover { stroke-width: 4; }
#cables .hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }
#cables .hit:hover + .cable, #cables .cable.hot { stroke-width: 4; }
#cables .rubber { fill: none; stroke: var(--wire); stroke-width: 2; stroke-dasharray: 4 4; }

/* janelas-nó */
.gwin { position: absolute; background: var(--paper); border: var(--frame); box-shadow: 4px 4px 0 var(--shadow); width: 250px; z-index: 50; }
.gwin.wide { width: 470px; }
.gwin.focused { outline: 3px solid var(--ink); outline-offset: 2px; }
.gwin-bar { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-bottom: var(--frame); cursor: move; user-select: none; touch-action: none; text-transform: uppercase; letter-spacing: 1px; }
.gwin-title { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gbtn { width: 18px; height: 18px; padding: 0; border: var(--frame); background: var(--paper); line-height: 1; flex: none; cursor: pointer; font: 14px/1 var(--ui); display: grid; place-items: center; }
.gbtn:active { background: var(--ink); color: var(--paper); }
.gwin-body { padding: 8px 10px 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.gwin input, .gwin select, .gwin textarea { min-width: 0; max-width: 100%; }
.gwin input[type=number] { width: 100%; background: var(--paper); border: var(--frame); border-radius: 0; padding: 1px 5px; }
.gwin.shaded .gwin-body > :not(.prow.port-row) { display: none; }
.gdesc { margin: 0; font-size: 16px; line-height: 1.05; }
.prow { position: relative; display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 24px; }
.prow > label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow.out { grid-template-columns: minmax(0, 1fr) auto; }
.prow.out > label { text-align: right; }
.prow.out .sum { text-align: left; }
.prow input[type=text], .prow input[type=number], .prow select, .prow textarea, .src-area {
  width: 100%; min-width: 0; background: var(--paper); border: var(--frame); border-radius: 0; padding: 1px 5px; font-size: 18px;
}
.prow input:disabled { border-style: dashed; opacity: 1; -webkit-text-fill-color: var(--ink); cursor: not-allowed; }
.src-area { resize: vertical; min-height: 52px; line-height: 1.05; }
.prow select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 12px) 50%, calc(100% - 7px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 20px; }
.sum { font-size: 16px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gport { position: absolute; width: 14px; height: 14px; background: var(--paper); border: var(--frame); cursor: crosshair; touch-action: none; top: 50%; }
.gport.in { left: -19px; transform: translateY(-50%); }
.gport.outp { right: -19px; transform: translateY(-50%); }
.gport.num { border-radius: 50%; }
.gport.rc { width: 12px; height: 12px; }
.gport.rc.in { left: -18px; transform: translateY(-50%) rotate(45deg); }
.gport.rc.outp { right: -18px; transform: translateY(-50%) rotate(45deg); }
.rclanes svg, .tonnetz svg { display: block; width: 100%; height: auto; outline: 2px solid var(--line); outline-offset: -2px; }
.tonnetz svg { cursor: crosshair; }
.gport.full { background: var(--ink); }
.gport.target { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--line); }
input[type=range] { width: 100%; accent-color: var(--ink); }
.gerr { margin: 0; padding: 2px 6px; border: var(--frame); background: var(--paper); font-size: 16px; }
.gerr::before { content: "! "; }
.ginfo { margin: 0; padding: 3px 6px; border: 1px dashed var(--ink); font-size: 16px; white-space: pre-wrap; line-height: 1.05; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.gb { background: var(--paper); border: var(--frame); border-radius: 0; padding: 1px 10px; cursor: pointer; }
.gb:hover { background: var(--ink); color: var(--paper); }
.gb.def { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--line); margin: 2px; }
.seg { display: inline-flex; }
.seg .gb { margin-left: -2px; }
.seg .gb[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px dashed var(--ink); outline-offset: 2px; }

/* pauta: sempre preto sobre branco */
.staffbox { position: relative; background: #ffffff; outline: 2px solid var(--line); outline-offset: -2px; overflow-x: auto; overflow-y: hidden; }
.staffbox svg { display: block; }
.playhead { position: absolute; top: 0; left: 0; width: 2px; margin-left: -1px; background: #1f5fff; opacity: .85; pointer-events: none; z-index: 2; }
.staffbox.big { max-height: 520px; overflow-y: auto; }
.lattice { overflow-x: auto; }
.extview svg { display: block; width: 100%; height: auto; outline: 2px solid var(--line); outline-offset: -2px; }
.extview.clickable svg { cursor: pointer; }
.extview + .staffbox { margin-top: 6px; }
.lattice svg { display: block; min-width: 100%; height: auto; max-height: 260px; outline: 2px solid var(--line); outline-offset: -2px; }
.neck svg { display: block; width: 100%; max-width: 260px; margin: 0 auto; height: auto; outline: 2px solid var(--line); outline-offset: -2px; }
.spec svg { display: block; width: 100%; height: auto; outline: 2px solid var(--line); outline-offset: -2px; }
.tbl { max-height: 230px; overflow: auto; outline: 2px solid var(--line); outline-offset: -2px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 17px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 1px 6px; text-align: right; white-space: nowrap; border-bottom: 1px dashed var(--ink); }
.tbl th { position: sticky; top: 0; background: var(--paper); border-bottom: var(--frame); }
.tbl td.l, .tbl th.l { text-align: left; }

/* diálogos */
.dlg-back { position: fixed; inset: 0; background: var(--backdrop); z-index: 9500; display: grid; place-items: center; padding: 16px; }
.dlg { background: var(--paper); border: var(--frame); box-shadow: 6px 6px 0 var(--shadow); width: min(560px, 100%); max-height: 86vh; overflow: auto; }
.dlg .gwin-bar { cursor: default; }
.dlg-body { padding: 12px 14px; display: grid; gap: 10px; }
.dlg-body p { margin: 0; }
.dlg-body textarea { width: 100%; min-height: 160px; border: var(--frame); background: var(--paper); font-size: 15px; font-family: ui-monospace, monospace; }
.dlg-body ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.kbd { border: 1px solid var(--ink); padding: 0 4px; }
.quick { position: absolute; z-index: 8000; background: var(--paper); border: var(--frame); box-shadow: 4px 4px 0 var(--shadow); width: 260px; }
.quick input { width: 100%; border: 0; border-bottom: var(--frame); padding: 4px 8px; background: var(--paper); font-size: 19px; }
.quick ul { overscroll-behavior: contain; touch-action: pan-y; list-style: none; margin: 0; padding: 4px 0; max-height: 280px; overflow-y: auto; }
.quick li { padding: 2px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.quick li .g { opacity: .6; font-size: 15px; }
.quick li.on, .quick li:hover { background: var(--ink); color: var(--paper); }
#minimap { position: fixed; right: 16px; bottom: 16px; z-index: 6000; background: var(--paper); border: var(--frame); box-shadow: 4px 4px 0 var(--shadow); cursor: pointer; }
@media (max-width: 640px) { #minimap { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
/* ================= núcleo portado (omtristan.js) ================= */
/**
 * omtristan.js
 * Port parcial para JavaScript da biblioteca OMTristan (OpenMusic),
 * de Tristan Murail — funções de harmonia espectral, intervalos e análise.
 *
 * Portado a partir das fontes Lisp de github.com/openmusic-project/OMTristan
 * (release 3.5, sources/TMlibrairie-OM.lisp).
 *
 * Convenções (iguais às do OM):
 *   - alturas em midicents (6000 = Dó central, 6900 = Lá 440 Hz)
 *   - "acorde" = array de números; "lista de acordes" = array de arrays
 *   - opções de unidade: 'midic' (padrão) ou 'hz'
 *   - approx: null | 2 (1/2 tom) | 4 (1/4) | 8 (1/8)
 *
 * Todas as funções são puras (não alteram as entradas) e síncronas.
 * O objeto `registry` mapeia os nomes originais do OM (ex.: 'sp-gen')
 * para as funções, permitindo despacho por comando textual.
 */

// ─────────────────────────────────────────────────────────────
// Conversões básicas
// ─────────────────────────────────────────────────────────────

/** midicents → Hz */
const mcToF = (mc) => mapDeep(mc, (x) => 440 * 2 ** ((x - 6900) / 1200));

/**
 * Hz → midicents (arredondado ao inteiro, como f->mc do OM).
 * Frequências negativas são refletidas (valor absoluto), como no RM do Esquisse.
 */
const fToMc = (f) =>
  mapDeep(f, (x) => Math.round(6900 + 1200 * Math.log2(Math.abs(x) / 440)));

/** Aproximação a 1/2, 1/4 ou 1/8 de tom (approx-m). */
const approxM = (mc, approx = 4) => {
  if (!approx) return mc;
  const grid = 200 / approx;
  return mapDeep(mc, (x) => Math.round(x / grid) * grid);
};

/** cents → razão de frequência (cents->ratio / cents->coef) */
const centsToRatio = (cents) => mapDeep(cents, (c) => 2 ** (c / 1200));

/** razão de frequência → cents (ratio->cents / coef->cents) */
const ratioToCents = (r) => mapDeep(r, (x) => 1200 * Math.log2(x));

// ─────────────────────────────────────────────────────────────
// Utilitários internos
// ─────────────────────────────────────────────────────────────

function mapDeep(v, fn) {
  return Array.isArray(v) ? v.map((x) => mapDeep(x, fn)) : fn(v);
}

const isListOfChords = (x) => Array.isArray(x) && Array.isArray(x[0]);
const toArray = (x) => (Array.isArray(x) ? x : [x]);
const flat = (x) => x.flat(Infinity);
const dedupe = (arr) => [...new Set(arr)];
const lispMod = (a, b) => ((a % b) + b) % b; // mod do Common Lisp (floor)
const toHz = (x, unit) => (unit === 'hz' ? x : mcToF(x));
const fromHz = (x, unit) => (unit === 'hz' ? x : fToMc(x));

/** Aplica fn a um acorde ou a cada acorde de uma lista de acordes. */
function perChord(input, fn) {
  return isListOfChords(input) ? input.map(fn) : fn(input);
}

/** n valores igualmente espaçados de a a b (n-arithm). */
function nArithm(a, b, n) {
  if (n <= 1) return [a];
  return Array.from({ length: n }, (_, i) => a + ((b - a) * i) / (n - 1));
}

// ─────────────────────────────────────────────────────────────
// 1 · SÉRIES HARMÔNICAS
// ─────────────────────────────────────────────────────────────

/**
 * rangcalc: ranks de begin a end filtrados por numer/denom.
 * Ex.: numer=1, denom=2 → só ranks ímpares (a partir de begin).
 */
function rangCalc(numer, denom, begin, end) {
  const cdeb = lispMod(begin, denom);
  const step = end < begin ? -1 : 1;
  const res = [];
  for (let n = begin; step > 0 ? n <= end : n >= end; n += step) {
    if (lispMod(n - cdeb, denom) < numer) res.push(n);
  }
  let out = res.filter((n) => n !== 0);
  if (out.includes(1) && out.includes(-1)) out = out.filter((n) => n !== -1);
  return out;
}

/**
 * hcalc: p = f · n^d + offset   (n > 0, harmônicos)
 *        p = f / |n|^d + offset (n < 0, sub-harmônicos)
 * com d = 1 + dist%/100.
 */
function hCalc(fundHz, ranks, distPct, offset, approx) {
  const d = 1 + distPct / 100;
  const res = [];
  for (const n of ranks) {
    if (n > 0) res.push(fToMc(fundHz * n ** d + offset));
    else if (n < 0) res.push(fToMc(fundHz / Math.abs(n) ** d + offset));
  }
  return approx ? approxM(res, approx) : res;
}

/**
 * sp-gen — série (in)harmônica sobre uma fundamental.
 * @param {number|number[]} fund  fundamental(is) em midicents
 * @param {object} o  { dist=0, numer=1, denom=1, begin=1, end=7, offset=0 (Hz), approx=null }
 * @returns acorde (ou lista de acordes, se fund for lista)
 */
function spGen(fund, { dist = 0, numer = 1, denom = 1, begin = 1, end = 7, offset = 0, approx = null } = {}) {
  const calc = (f) => hCalc(mcToF(f), rangCalc(numer, denom, begin, end), dist, offset, approx);
  if (Array.isArray(fund)) return fund.length === 1 ? calc(fund[0]) : fund.map(calc);
  return calc(fund);
}

/**
 * n-sp-gen — parciais específicos (ranks podem ser não inteiros ou negativos).
 * @param {number|number[]} fund
 * @param {number|number[]} ranks
 * @param {object} o { dist=0, offset=0, approx=null }
 */
function nSpGen(fund, ranks, { dist = 0, offset = 0, approx = null } = {}) {
  const calc = (f) => hCalc(mcToF(f), toArray(ranks), dist, offset, approx);
  if (Array.isArray(fund)) return fund.length === 1 ? calc(fund[0]) : fund.map(calc);
  return calc(fund);
}

// ─────────────────────────────────────────────────────────────
// 2 · MODULAÇÃO DE FREQUÊNCIA
// ─────────────────────────────────────────────────────────────

/** Função de Bessel de 1ª espécie J_n(x), série de potências (ok até x≈30). */
function besselJ(n, x) {
  let sum = 0;
  let term = (x / 2) ** n / factorial(n);
  for (let k = 0; k < 80; k++) {
    sum += term;
    term *= -((x / 2) ** 2) / ((k + 1) * (k + 1 + n));
    if (Math.abs(term) < 1e-15 * Math.max(1, Math.abs(sum)) && k > x) break;
  }
  return sum;
}
function factorial(n) {
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

/**
 * fmSpec — espectro FM (portadora c, moduladora m, índice I, em Hz).
 * Réplica do algoritmo do Esquisse: componentes c ± k·m para k = 0..ordem,
 * amplitudes J_k(I) (com sinal alternado nas laterais inferiores de ordem ímpar),
 * frequências negativas refletidas com inversão de fase e somadas às coincidentes,
 * amplitudes normalizadas para soma = 1000.
 * @returns array de { freq, amp } em ordem crescente
 */
function fmSpec(c, m, index, order = null) {
  const MAXORDER = 25;
  const iInt = Number.isInteger(index) ? index : Math.ceil(index);
  const ord = Math.min(order ?? iInt + 1, MAXORDER);
  const bins = new Map();
  const add = (f, a) => {
    const key = Math.round(f * 1e6) / 1e6;
    bins.set(key, (bins.get(key) ?? 0) + a);
  };
  add(c, besselJ(0, index));
  for (let k = 1; k <= ord; k++) {
    const jk = besselJ(k, index);
    add(c + k * m, jk);
    let f = c - k * m;
    let a = k % 2 ? -jk : jk;
    if (f < 0) {
      f = -f;
      a = -a;
    }
    add(f, a);
  }
  let spec = [...bins.entries()]
    .map(([freq, amp]) => ({ freq, amp: Math.abs(amp) }))
    .filter((p) => p.freq > 0)
    .sort((a, b) => a.freq - b.freq);
  const total = spec.reduce((s, p) => s + p.amp, 0);
  spec = spec.map((p) => ({ freq: p.freq, amp: Math.trunc((p.amp * 1000) / total) }));
  return spec;
}

/**
 * fmo (freq-mod) — espectro FM como acorde.
 * @param {number|number[]} carrier
 * @param {number|number[]} modul
 * @param {number|number[]} index  (1–25)
 * @param {object} o { unit='midic'|'hz', type='chord'|'seq' }
 * @returns { midics, vels } (type 'chord') ou array desses (type 'seq')
 * Velocidades: round(127/3 · log10(amp)), faixa audível 15–20000 Hz.
 */
function fmo(carrier, modul, index, { unit = 'midic', type = 'chord' } = {}) {
  const C = toArray(carrier), M = toArray(modul), I = toArray(index);
  const n = Math.max(C.length, M.length, I.length);
  const at = (arr, i) => arr[Math.min(i, arr.length - 1)];
  const chords = [];
  for (let i = 0; i < n; i++) {
    const c = unit === 'midic' ? mcToF(at(C, i)) : at(C, i);
    const m = unit === 'midic' ? mcToF(at(M, i)) : at(M, i);
    const spec = fmSpec(c, m, at(I, i));
    const vels = spec.map((p) => (p.amp <= 0 ? 0 : Math.round((127 / 3) * Math.log10(p.amp))));
    const keep = spec.map((p) => p.freq >= 15 && p.freq <= 20000);
    chords.push({
      midics: spec.filter((_, j) => keep[j]).map((p) => fToMc(p.freq)),
      vels: vels.filter((_, j) => keep[j]),
      freqs: spec.filter((_, j) => keep[j]).map((p) => p.freq),
    });
  }
  if (type === 'seq') return chords;
  return {
    midics: chords.flatMap((c) => c.midics),
    vels: chords.flatMap((c) => c.vels),
    freqs: chords.flatMap((c) => c.freqs),
  };
}

// ─────────────────────────────────────────────────────────────
// 3 · MODULAÇÃO EM ANEL
// ─────────────────────────────────────────────────────────────

/**
 * rmo (ring-modulation) — cada nota de ch1 modulada por todas as de ch2.
 * Como no original: o resultado inclui as notas originais do par e é filtrado
 * entre 100 e 12000 (na unidade de trabalho).
 * @param {object} o { unit='midic'|'hz', type='chord'|'seq' }
 */
function rmo(ch1, ch2, { unit = 'midic', type = 'chord' } = {}) {
  const pair = (a, b) => {
    const fa = toHz(a, unit), fb = toHz(b, unit);
    const res = [a, b, ...fromHz([fa + fb, fa - fb].filter((x) => x !== 0), unit)];
    return res.filter((x) => x >= 100 && x <= 12000);
  };
  const perNote = toArray(ch1).map((note) => dedupe(toArray(ch2).flatMap((mod) => pair(note, mod))));
  return type === 'chord' ? dedupe(perNote.flat()) : perNote;
}

/**
 * rm-gen (ring-harm) — RM entre as séries harmônicas de funda (hqa parciais)
 * e fundb (hqb parciais). Camadas organizadas por ordem crescente de rank.
 * @param {object} o { type='chord'|'layers', output='excluded'|'included', unit='midic'|'hz' }
 */
function rmGen(funda, fundb, hqa = 2, hqb = 3, { type = 'chord', output = 'excluded', unit = 'midic' } = {}) {
  const f1 = toHz(funda, unit), f2 = toHz(fundb, unit);
  const mx = Math.max(hqa, hqb);
  const layers = [];
  for (let m = 1; m <= mx; m++) {
    const layer = [];
    for (let ia = 1; ia <= Math.min(m, hqa); ia++) {
      for (let ib = 1; ib <= Math.min(m, hqb); ib++) {
        if (ia < m && ib < m) continue;
        layer.push(ia * f1 + ib * f2);
        const d = ia * f1 - ib * f2;
        if (d !== 0) layer.push(d);
      }
    }
    layers.push(fromHz(layer, unit));
  }
  if (output === 'included') layers.unshift([funda, fundb]);
  return type === 'chord' ? layers.flat() : layers;
}

/**
 * rm-intra (intermod) — sons de soma/diferença entre todos os pares de um acorde.
 * @param {number[]} chord
 * @param {'add'|'diff'|'ring'} resul
 * @param {number} approx 2|4|8
 */
function rmIntra(chord, resul = 'ring', approx = 4) {
  const f = mcToF(chord);
  const res = [];
  for (let i = 0; i < f.length; i++) {
    for (let j = i + 1; j < f.length; j++) {
      if (resul !== 'diff') res.push(f[i] + f[j]);
      if (resul !== 'add') res.push(f[i] - f[j]);
    }
  }
  return uniqueNotes(fToMc(res.filter((x) => x !== 0)), approx);
}

/**
 * rm-approx (resultants) — somas/diferenças entre dois acordes, sem repetições
 * após aproximação.
 */
function rmApprox(ch1, ch2, resul = 'ring', approx = 4) {
  const f1 = mcToF(toArray(ch1)), f2 = mcToF(toArray(ch2));
  const res = [];
  for (const a of f1) {
    for (const b of f2) {
      if (resul !== 'diff') res.push(a + b);
      if (resul !== 'add') res.push(a - b);
    }
  }
  return uniqueNotes(fToMc(res.filter((x) => x !== 0)), approx);
}

// ─────────────────────────────────────────────────────────────
// 4 · DISTORÇÃO E DESLOCAMENTO DE FREQUÊNCIA
// ─────────────────────────────────────────────────────────────

/**
 * disto (freq-distor) — reescala linear em Hz: minin→minout, maxin→maxout.
 * @param {object} o { minin, maxin, output='excluded'|'included', unit='midic'|'hz' }
 */
function disto(chord, minout, maxout, { minin = null, maxin = null, output = 'excluded', unit = 'midic' } = {}) {
  return perChord(chord, (ch) => {
    const lo = minin ?? Math.min(...ch);
    const hi = maxin ?? Math.max(...ch);
    const [x, a, b, i0, i1] = [ch, minout, maxout, lo, hi].map((v) => toHz(v, unit));
    const scaled = x.map((v) => (i1 === i0 ? a : a + ((v - i0) * (b - a)) / (i1 - i0)));
    const res = fromHz(scaled, unit);
    return output === 'included' ? [...ch, ...res] : res;
  });
}

/**
 * dist-proc (fdistor-proc) — distorção progressiva em `steps` passos.
 * Os extremos são interpolados na unidade de entrada, como no original.
 * @returns lista de acordes
 */
function distProc(chord, steps, minout, maxout, { minin = null, maxin = null, output = 'excluded', unit = 'midic' } = {}) {
  const valmin = minin ?? Math.min(...chord);
  const valmax = maxin ?? Math.max(...chord);
  const stepmin = steps ? (minout - valmin) / steps : 0;
  const stepmax = steps ? (maxout - valmax) / steps : 0;
  const res = [];
  for (let n = output === 'included' ? 0 : 1; n <= steps; n++) {
    res.push(
      disto(chord, Math.round(valmin + n * stepmin), Math.round(valmax + n * stepmax), { minin, maxin, unit })
    );
  }
  return res;
}

/**
 * fsh (freq-shift) — soma dfreq Hz a todas as frequências.
 * dfreq pode ser lista → uma transposição por valor.
 * @param {object} o { type='chord'|'seq', output='excluded'|'included', unit='midic'|'hz' }
 */
function fsh(chord, dfreq, { type = 'chord', output = 'excluded', unit = 'midic' } = {}) {
  const shiftOne = (ch, d) => {
    const res = fromHz(toHz(ch, unit).map((f) => f + d), unit);
    return output === 'included' ? [...ch, ...res] : res;
  };
  if (Array.isArray(dfreq)) {
    const seq = dfreq.map((d) => perChord(chord, (ch) => shiftOne(ch, d)));
    return type === 'chord' ? seq.flat() : seq;
  }
  return perChord(chord, (ch) => shiftOne(ch, dfreq));
}

/**
 * fs-proc — deslocamento progressivo de 0 a dfreq Hz, em `steps` valores.
 * @returns lista de acordes
 */
function fsProc(chord, dfreq, steps, { output = 'excluded', unit = 'midic' } = {}) {
  let ld = nArithm(0, dfreq, steps);
  if (output === 'excluded') ld = ld.slice(1);
  return ld.map((d) => fsh(chord, d, { unit }));
}

// ─────────────────────────────────────────────────────────────
// 5 · OUTROS TRATAMENTOS
// ─────────────────────────────────────────────────────────────

/**
 * f-densifier (densif/f) — insere `density` parciais equidistantes em Hz entre
 * cada par de notas contíguas situadas entre mmin e mmax (midicents).
 */
function fDensifier(chord, density = 1, mmin = null, mmax = null) {
  const f = mcToF(chord);
  const lo = mmin == null ? Math.min(...f) : mcToF(mmin);
  const hi = mmax == null ? Math.max(...f) : mcToF(mmax);
  const res = [];
  for (let i = 0; i < f.length - 1; i++) {
    const [a, b] = [f[i], f[i + 1]];
    res.push(a);
    if (Math.min(a, b) >= lo && Math.max(a, b) <= hi && density > 0) {
      const iv = (b - a) / (density + 1);
      for (let n = 1; n <= density; n++) res.push(a + n * iv);
    }
  }
  res.push(f[f.length - 1]);
  return fToMc(res.map(Math.round)); // nbdec = 0 no original
}

/**
 * f-interpol — interpolação em Hz entre dois acordes (ou notas), em `steps` passos.
 * curve = 1 → linear em frequência; <1 / >1 curva de potência.
 * (A curva do `interpolation` do núcleo do OM é aproximada por uma lei de potência.)
 */
function fInterpol(begin, end, steps = 5, curve = 1) {
  const b = mcToF(begin), e = mcToF(end);
  return Array.from({ length: steps }, (_, i) => {
    const t = steps === 1 ? 0 : (i / (steps - 1)) ** curve;
    return fToMc(mapPair(b, e, (x, y) => x + (y - x) * t));
  });
}
function mapPair(a, b, fn) {
  if (Array.isArray(a)) return a.map((x, i) => fn(x, Array.isArray(b) ? b[i] : b));
  return fn(a, b);
}

/**
 * vocoder — projeta a estrutura `struct` sobre o reservatório `reservoir`,
 * escolhendo para cada nota o valor mais próximo (em midicents ou em Hz).
 * @param {'midic'|'freq'} mode  critério de distância
 */
function vocoder(struct, reservoir, mode = 'midic') {
  const nearest = (list, x) => list.reduce((best, v) => (Math.abs(v - x) < Math.abs(best - x) ? v : best));
  const one = (st) => {
    if (mode === 'freq') return fToMc(mcToF(st).map((x) => nearest(mcToF(reservoir), x)));
    return st.map((x) => nearest(reservoir, x));
  };
  return isListOfChords(struct) ? struct.map(one) : one(struct);
}

// ─────────────────────────────────────────────────────────────
// 6 · INTERVALOS
// ─────────────────────────────────────────────────────────────

/**
 * chord-multiplier (mul-chord) — reproduz a estrutura intervalar de ch2 a partir
 * de cada nota de ch1.
 * @param {'chord'|'seq'} type
 */
function chordMultiplier(ch1, ch2, type = 'chord') {
  const base = ch2[0];
  const seq = ch1.map((n) => ch2.map((x) => n + (x - base)));
  return type === 'chord' ? dedupe(seq.flat()).sort((a, b) => a - b) : seq;
}

/**
 * oct-trans — rebate cada nota por oitavas até caber em [min, max] (midicents).
 * (O argumento `pivot` do original não foi portado.)
 */
function octTrans(chord, min, max) {
  return perChord(chord, (ch) =>
    ch.map((x) => {
      let y = x;
      while (y < min) y += 1200;
      while (y > max) y -= 1200;
      return y;
    })
  );
}

// ─────────────────────────────────────────────────────────────
// 7 · CONJUNTOS
// ─────────────────────────────────────────────────────────────

/** unique-notes — aproxima e remove duplicatas. */
function uniqueNotes(chord, approx = 4, ...others) {
  const all = [...approxM(chord, approx), ...flat(others.map((o) => approxM(o, approx)))];
  return dedupe(all).filter((x) => x !== 0);
}

/** common-notes — notas comuns a todos os acordes, após aproximação. */
function commonNotes(approx, ...chords) {
  const sets = chords.map((c) => new Set(approxM(c, approx)));
  return [...sets[0]].filter((x) => sets.every((s) => s.has(x)));
}

/** notes-union — união sem repetição, após aproximação. */
function notesUnion(approx, ...chords) {
  return dedupe(chords.flatMap((c) => approxM(c, approx))).sort((a, b) => a - b);
}

// ─────────────────────────────────────────────────────────────
// 8 · ANÁLISE
// ─────────────────────────────────────────────────────────────

/**
 * MDC tolerante (G. Assayag, 1993): maior valor g tal que cada frequência
 * esteja, dentro da tolerância gridRatio, a um múltiplo inteiro de g.
 */
function tolerantGcd(values, gridRatio) {
  const above = (v) => v * (1 + gridRatio);
  const below = (v) => v / (1 + gridRatio);
  const tryGcd = (vals, gmin, gmax) => {
    if (gmin > gmax) return null;
    if (vals.length === 0) return (gmin + gmax) / 2;
    const vb = below(vals[0]), va = above(vals[0]);
    const qmin = Math.ceil(vb / gmax), qmax = Math.floor(va / gmin);
    for (let q = qmin; q <= qmax; q++) {
      const r = tryGcd(vals.slice(1), Math.max(gmin, vb / q), Math.min(gmax, va / q));
      if (r != null) return r;
    }
    return null;
  };
  return tryGcd(values, 0.1, above(Math.min(...values)));
}

/**
 * virtual-fund — fundamental virtual: a mais alta fundamental da qual as notas
 * podem ser consideradas parciais, com tolerância em cents.
 * @param {object} o { cents=50, unit='midic'|'hz' }
 */
function virtualFund(chord, { cents = 50, unit = 'midic' } = {}) {
  return perChord(chord, (ch) => {
    const g = tolerantGcd(toHz(ch, unit), 2 ** (cents / 1200) - 1);
    return g == null ? null : fromHz(g, unit);
  });
}

/**
 * center-freq (best-freq) — centro de gravidade do acorde.
 * Nota: o código Lisp calcula a MÉDIA GEOMÉTRICA das frequências
 * (média dos logaritmos), e não os mínimos quadrados citados na docstring.
 */
function centerFreq(chord, { unit = 'midic' } = {}) {
  return perChord(chord, (ch) => {
    const f = toHz(ch, unit);
    const g = Math.exp(f.reduce((s, x) => s + Math.log(x), 0) / f.length);
    return fromHz(g, unit);
  });
}

/**
 * closest-harm — parcial da série sobre `fund` mais próximo de cada nota.
 * @param {object} o { type='notes'|'ranks', unit='midic'|'hz' }
 * Correção: para notas abaixo da fundamental o original devolve f0/f, que
 * n-harm interpretaria como harmônico; aqui devolvemos o sub-harmônico
 * mais próximo como rank negativo (convenção de sp-gen/n-sp-gen).
 */
function closestHarm(chord, fund, { type = 'notes', unit = 'midic' } = {}) {
  const f0 = toHz(fund, unit);
  const rankOf = (f) => {
    if (f <= f0) return -Math.max(1, Math.round(f0 / f));
    const ratio = f / f0;
    const n = Math.floor(ratio);
    return ratio / n < (n + 1) / ratio ? n : n + 1;
  };
  return perChord(chord, (ch) => {
    const ranks = toHz(ch, unit).map(rankOf);
    if (type === 'ranks') return ranks;
    return ranks.map((r) => fromHz(r > 0 ? f0 * r : f0 / -r, unit));
  });
}

/**
 * which-dist (quelle-dist) — estima o percentual de distorção de um acorde,
 * tomando a nota mais grave como fundamental.
 * modos: 'one-harm' (nota mais aguda = rank `rank`),
 *        'spectrum' (n-ésima nota do acorde = rank `rank`),
 *        'all'      (média sobre todas as notas, ranks 2..n).
 */
function whichDist(chord, rank = 2, mode = 'one-harm') {
  return perChord(chord, (ch) => {
    const min = Math.min(...ch);
    const d = (r, note) => Math.log(mcToF(note) / mcToF(min)) / Math.log(r);
    let v;
    if (mode === 'all') {
      const ds = [];
      for (let r = 2; r <= ch.length; r++) ds.push(d(r, ch[r - 1]));
      v = ds.reduce((a, b) => a + b, 0) / ds.length;
    } else if (mode === 'spectrum') v = d(rank, ch[rank - 1]);
    else v = d(rank, Math.max(...ch));
    return Math.round((v * 100 - 100) * 1e4) / 1e4;
  });
}

/**
 * reharmonizer — substitui cada nota pelo parcial mais próximo da sua
 * fundamental virtual (tolerância em cents).
 */
function reharmonizer(chord, toler = 25) {
  return perChord(chord, (ch) => {
    const vf = virtualFund(ch, { cents: toler });
    return closestHarm(ch, vf, { type: 'notes' });
  });
}

/** inter-freq — intervalos em Hz entre notas sucessivas. */
function interFreq(chord, nbdec = 2) {
  const f = mcToF(chord);
  const k = 10 ** nbdec;
  return f.slice(1).map((x, i) => Math.round((x - f[i]) * k) / k);
}

// ─────────────────────────────────────────────────────────────
// Registro por nome original do OM (para despacho por comando)
// ─────────────────────────────────────────────────────────────

const registry = {
  'mc->f': mcToF,
  'f->mc': fToMc,
  'approx-m': approxM,
  'cents->ratio': centsToRatio,
  'ratio->cents': ratioToCents,
  'sp-gen': spGen,
  'n-sp-gen': nSpGen,
  fmo,
  rmo,
  'rm-gen': rmGen,
  'rm-intra': rmIntra,
  'rm-approx': rmApprox,
  disto,
  'dist-proc': distProc,
  fsh,
  'fs-proc': fsProc,
  'f-densifier': fDensifier,
  'f-interpol': fInterpol,
  vocoder,
  'chord-multiplier': chordMultiplier,
  'oct-trans': octTrans,
  'unique-notes': uniqueNotes,
  'common-notes': commonNotes,
  'notes-union': notesUnion,
  'virtual-fund': virtualFund,
  'center-freq': centerFreq,
  'closest-harm': closestHarm,
  'which-dist': whichDist,
  reharmonizer,
  'inter-freq': interFreq,
};

/** Chama uma função pelo nome do OM: call('sp-gen', 3600, { end: 12 }) */
function call(name, ...args) {
  const fn = registry[name];
  if (!fn) throw new Error(`OMTristan: função desconhecida "${name}"`);
  return fn(...args);
}


</script>
<script>
// ════════════════════════════════════════════════════════════════
//  OMRC — Rhythm Constraints (Örjan Sandred, IRCAM 1999 / Estocolmo 2002–2005)
//  porta para JS: domínios por camada, regras estritas e heurísticas, busca com retrocesso
// ════════════════════════════════════════════════════════════════
const RC = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => (a / gcd(a, b)) * b;
  /** número → [n, d] */
  function frac(x) {
    if (Array.isArray(x)) return x;
    if (Number.isInteger(x)) return [x, 1];
    const s = Math.sign(x); x = Math.abs(x);

function convexHull(pts) {

    ins: [I('in', 'entrada', 'in'), I('toler', 'tolerância ¢', 'num', 25)], outs: [OUT, { id: 'val', label: 'fundamentais', t: 'num' }],
    run: (a) => {
      const ch = need(a.in);
      return { out: VC(each(ch, (c) => reharmonizer(c, a.toler))), val: VN(ch.map((c) => virtualFund(c, { cents: a.toler }))) };
    } },
  'chord-multiplier': { group: 'Intervalos', title: 'chord-multiplier', desc: 'Reproduz a estrutura sobre cada nota da entrada.',
    ins: [I('in', 'entrada', 'in'), I('ch2', 'estrutura', 'chords', '6000 6350 6700'), I('type', 'saída', 'sel', 'seq', { opts: [['seq', 'um por nota'], ['chord', 'acorde']] })], outs: [OUT],
    run: (a) => ({ out: VC(each(need(a.in), (c) => chordMultiplier(sortNum(c), a.ch2[0] || [6000], a.type))) }) },
  'oct-trans': { group: 'Intervalos', title: 'oct-trans', desc: 'Rebate por oitavas para dentro de um âmbito.',
    ins: [I('in', 'entrada', 'in'), I('min', 'grave', 'pitch', 'C4'), I('max', 'agudo', 'pitch', 'C5')], outs: [OUT],
    run: (a) => { if (a.max - a.min < 1200) throw new Error('o âmbito precisa de ao menos uma oitava'); return { out: VC(each(need(a.in), (c) => sortNum(octTrans(c, a.min, a.max)))) }; } },
  transpor: { group: 'Melodia (OM)', title: 'transpor', desc: 'Soma cents a todas as notas (om+).',
    ins: [I('in', 'entrada', 'in'), I('cents', 'cents', 'num', 700)], outs: [OUT],
    run: (a) => ({ out: VC(each(need(a.in), (c) => c.map((x) => x + a.cents)), a.in$vels) }) },

  // ── melodia (funções centrais do OpenMusic) ──
  rotate: { group: 'Melodia (OM)', title: 'rotate', desc: 'Permutação circular (rotate do OM): (a b c d e) 1 → (b c d e a).',
    ins: [I('in', 'entrada', 'in'), I('n', 'n', 'num', 1), I('mode', 'o que gira', 'sel', 'pitches', { opts: [['pitches', 'alturas (ritmo fica)'], ['seq', 'ordem dos acordes']] })], outs: [OUT],
    run: (a) => {
      const ch = need(a.in);
      if (a.mode === 'seq') return { out: VC(omRotate(ch, a.n), a.in$vels ? omRotate(a.in$vels, a.n) : null) };
      const flatL = omRotate(ch.flat(), a.n); let k = 0;
      return { out: VC(ch.map((c) => c.map(() => flatL[k++]))) };
    } },
  retrogrado: { group: 'Melodia (OM)', title: 'retrógrado', desc: 'Inverte a ordem (reverse). O ritmo pode ser mantido ou também retrogradado.',
    ins: [I('in', 'entrada', 'in'), I('rit', 'ritmo', 'sel', 'keep', { opts: [['keep', 'mantém'], ['rev', 'retrogradado']] })], outs: [OUT], noTiming: true,
    run: (a) => {
      const ch = need(a.in), t = timing(a.in$v);
      const out = [...ch].reverse(), vels = a.in$vels ? [...a.in$vels].reverse() : null;
      if (!t || t.onsets.length !== ch.length) return { out: VC(out, vels) };
      if (a.rit === 'keep') return { out: VC(out, vels, t) };
      const end = Math.max(...t.onsets.map((o, i) => o + t.durs[i]));
      const ons = t.onsets.map((o, i) => end - (o + t.durs[i])).reverse(), durs = [...t.durs].reverse();
      return { out: VC(out, vels, { onsets: ons, durs, bars: t.bars, tempo: t.tempo, nota: t.nota ? buildNota(t.nota.ev.slice().reverse().map((e) => (e.c == null ? -1 : 1) * FR.val(e.d)), t.nota.sigs) : null }) };
    } },
  inversao: { group: 'Melodia (OM)', title: 'inversão', desc: 'Espelha as alturas em torno de um eixo: x → 2·eixo − x. Sem eixo, usa a primeira nota.',
    ins: [I('in', 'entrada', 'in'), I('axis', 'eixo', 'opitch', '')], outs: [OUT],
    run: (a) => { const ch = need(a.in); const ax = a.axis ?? ch[0][0]; return { out: VC(ch.map((c) => c.map((x) => 2 * ax - x)), a.in$vels), info: `eixo ${name12(ax)}` }; } },
  interlock: { group: 'Melodia (OM)', title: 'interlock', desc: 'Insere os acordes de B antes das posições indicadas de A (interlock do OM; posições a partir de 0).',
    ins: [I('in', 'A', 'in'), I('b', 'B', 'in'), I('plc', 'posições', 'nums', '1 3 5')], outs: [OUT],
    run: (a) => { if (!a.in.length) throw new Error('conecte A'); return { out: VC(omInterlock(a.in, a.b, a.plc)) }; } },
  'x->dx': { group: 'Melodia (OM)', title: 'x->dx', desc: 'Intervalos entre notas sucessivas (em cents).',
    ins: [I('in', 'entrada', 'in')], outs: [{ id: 'val', label: 'intervalos', t: 'num' }],
    run: (a) => { const f = need(a.in).flat(); const d = f.slice(1).map((x, i) => x - f[i]); return { val: VN(d), info: d.join(' ') }; } },
  'dx->x': { group: 'Melodia (OM)', title: 'dx->x', desc: 'Reconstrói uma melodia a partir da nota inicial e dos intervalos.',
    ins: [I('start', 'início', 'pitch', 'C4'), I('dx', 'intervalos', 'nums', '200 150 -350 700 -50')], outs: [OUT],
    run: (a) => { let x = a.start; const out = [[x]]; a.dx.forEach((d) => out.push([(x += d)])); return { out: VC(out) }; } },
  'permut-random': { group: 'Melodia (OM)', title: 'permut-random', desc: 'Permutação aleatória da ordem; a semente torna o sorteio reprodutível.',
    ins: [I('in', 'entrada', 'in'), I('seed', 'semente', 'num', 1)], outs: [OUT],
    run: (a) => { const ch = [...need(a.in)], r = rng(a.seed); for (let i = ch.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [ch[i], ch[j]] = [ch[j], ch[i]]; } return { out: VC(ch) }; } },
  'group-list': { group: 'Melodia (OM)', title: 'group-list', desc: 'Agrupa as notas em acordes segundo uma segmentação (2 3 1…).',
    ins: [I('in', 'entrada', 'in'), I('seg', 'segmentação', 'nums', '2 3 1'), I('mode', 'leitura', 'sel', 'linear', { opts: [['linear', 'linear'], ['circular', 'circular']] })], outs: [OUT],
    run: (a) => ({ out: VC(omGroupList(need(a.in).flat(), a.seg, a.mode).map(sortNum)) }) },
  'list-modulo': { group: 'Melodia (OM)', title: 'list-modulo', desc: 'Separa as notas de n em n em grupos (list-modulo do OM).',
    ins: [I('in', 'entrada', 'in'), I('n', 'módulo', 'num', 2)], outs: [OUT],
    run: (a) => { const f = need(a.in).flat(), k = Math.max(1, Math.round(a.n)); return { out: VC(Array.from({ length: k }, (_, i) => f.filter((_, j) => j % k === i))) }; } },
  flat: { group: 'Melodia (OM)', title: 'flat', desc: 'Desfaz os acordes em uma linha de notas isoladas (grave → agudo).',
    ins: [I('in', 'entrada', 'in')], outs: [OUT], noTiming: true,
    run: (a) => ({ out: VC(need(a.in).flatMap((c) => sortNum(c).map((x) => [x]))) }) },

  // ── ritmo (árvores rítmicas como proporções, à maneira de tree2ratio) ──
  ritmo: { group: 'Ritmo (OM)', title: 'Ritmo', desc: 'Proporções (1/4 = semínima, negativo = pausa), como a saída de tree2ratio.',
    ins: [I('text', 'proporções', 'text', '1/8 1/8 1/4 -1/8 3/8 1/16 1/16 1/8')], outs: [{ id: 'out', label: 'ritmo', t: 'num' }],
    run: (a) => { const r = parseRatios(a.text); return { out: VN(r), info: ratiosInfo(r) }; } },
  rotatetree: { group: 'Ritmo (OM)', title: 'rotatetree', desc: 'Rotação das durações (pulsos) por n posições.',
    ins: [I('r', 'ritmo', 'nums', '1/4 1/8 1/8 -1/4 1/2'), I('n', 'n', 'num', 1)], outs: [{ id: 'out', label: 'ritmo', t: 'num' }], ratios: ['r'],
    run: (a) => { const r = omRotate(a.r, a.n); return { out: VN(r), info: ratiosInfo(r) }; } },
  reversetree: { group: 'Ritmo (OM)', title: 'reversetree', desc: 'Retrógrado rítmico.',
    ins: [I('r', 'ritmo', 'nums', '1/4 1/8 1/8 -1/4 1/2')], outs: [{ id: 'out', label: 'ritmo', t: 'num' }], ratios: ['r'],
    run: (a) => { const r = [...a.r].reverse(); return { out: VN(r), info: ratiosInfo(r) }; } },
  'invert-rhythm': { group: 'Ritmo (OM)', title: 'invert-rhythm', desc: 'Notas viram pausas e pausas viram notas.',
    ins: [I('r', 'ritmo', 'nums', '1/4 1/8 1/8 -1/4 1/2')], outs: [{ id: 'out', label: 'ritmo', t: 'num' }], ratios: ['r'],
    run: (a) => { const r = a.r.map((x) => -x); return { out: VN(r), info: ratiosInfo(r) }; } },
  'aumentar': { group: 'Ritmo (OM)', title: 'aumentação', desc: 'Multiplica as durações (2 = aumentação, 1/2 = diminuição).',
    ins: [I('r', 'ritmo', 'nums', '1/4 1/8 1/8 -1/4 1/2'), I('f', 'fator', 'nums', '2')], outs: [{ id: 'out', label: 'ritmo', t: 'num' }], ratios: ['r', 'f'],
    run: (a) => { const f = a.f[0] || 1; const r = a.r.map((x) => x * f); return { out: VN(r), info: ratiosInfo(r) }; } },
  'tree-canon': { group: 'Ritmo (OM)', title: 'tree-canon', desc: 'Desloca o ritmo inserindo n unidades de pausa no início (para cânones).',
    ins: [I('r', 'ritmo', 'nums', '1/4 1/8 1/8 -1/4 1/2'), I('unit', 'unidade', 'nums', '1/8'), I('n', 'vezes', 'num', 1)], outs: [{ id: 'out', label: 'ritmo', t: 'num' }], ratios: ['r', 'unit'],
    run: (a) => { const u = Math.abs(a.unit[0] || 0.125) * Math.max(0, Math.round(a.n)); const r = u ? [-u, ...a.r] : [...a.r]; return { out: VN(r), info: ratiosInfo(r) }; } },
  'interlock-r': { group: 'Ritmo (OM)', title: 'interlock rítmico', desc: 'interlock do OM aplicado a durações: insere B antes das posições de A.',
    ins: [I('r', 'A', 'nums', '1/4 1/4 1/4 1/4'), I('r2', 'B', 'nums', '1/16 1/16'), I('plc', 'posições', 'nums', '1 3')], outs: [{ id: 'out', label: 'ritmo', t: 'num' }], ratios: ['r', 'r2'],
    run: (a) => { const r = omInterlock(a.r, a.r2, a.plc); return { out: VN(r), info: ratiosInfo(r) }; } },
  voz: { group: 'Ritmo (OM)', title: 'voz', desc: 'Junta alturas e ritmo (como a classe voice). As alturas se repetem se faltarem. Com compasso, a partitura e o MIDI ganham barras e fórmulas de compasso.',
    ins: [I('in', 'alturas', 'in'), I('r', 'ritmo', 'nums', '1/8 1/8 1/4 -1/8 3/8 1/16 1/16 1/8'), I('tempo', 'tempo ♩', 'num', 72), I('sig', 'compasso', 'text', '')], outs: [OUT], ratios: ['r'], noTiming: true,
    run: (a) => {
      const ch = need(a.in), tempo = Math.max(1, a.tempo), whole = 4 * 60000 / tempo;
      const chords = [], vels = [], onsets = [], durs = []; let t = 0, k = 0;
      a.r.forEach((x) => { const d = Math.abs(x) * whole; if (x > 0) { chords.push(ch[k % ch.length]); vels.push(a.in$vels?.[k % ch.length] || null); onsets.push(t); durs.push(d); k++; } t += d; });
      const sigs = String(a.sig || '').trim() ? parseSigs(a.sig) : a.r$meter || null;
      const bars = sigs && sigs.length ? barsFor(sigs, t, whole) : null;
      const nota = bars ? buildNota(a.r, sigs) : null;
      return { out: VC(chords, a.in$vels ? vels : null, { onsets, durs, bars, tempo, nota }),
        info: `${k} notas · ${(t / 1000).toFixed(2)} s${bars ? ` · ${bars.length - 1} compasso(s): ${[...new Set(sigs.map((x) => x.join('/')))].join(' ')}` : ' · sem compasso'}` };
    } },
  'arvore': { group: 'Métrica', title: 'árvore rítmica', desc: 'Árvore rítmica do OpenMusic (RT): compasso + proporções, com grupos (n (subdivisões)), pausas negativas e ligaduras com ponto (1.0). Também aceita a forma curta: 4/4 (1 1 (1 (1 1 1)) 1).',
    ins: [I('text', 'árvore', 'area', '? (((4 4) (1 (1 (1 2 1 1)) 1 1)) ((3 4) (1 -1 (1 (1 1 1)))) ((5 8) (2 3.0)))')], outs: [ROUTM],
    run: (a) => { const { meas, events } = parseRT(a.text); const r = eventsToRatios(events); return { out: withMeter(VN(r), meas), info: `${meas.length} compasso(s): ${meas.map((m) => m.join('/')).join(' ')}\n${ratiosInfo(r)}` }; } },
  mktree: { group: 'Métrica', title: 'mktree', desc: 'Encaixa um ritmo (proporções) em compassos, como o mktree do OpenMusic: divide as durações nas barras com ligaduras e mostra a árvore. Um só compasso se repete; numa lista, o último se repete.',
    ins: [I('r', 'ritmo', 'nums', '3/8 3/8 1/4 1/8 -1/8 5/8 1/4'), I('sig', 'compassos', 'text', '3/4 2/4')], outs: [ROUTM], ratios: ['r'],
    run: (a) => { const sigs = parseSigs(a.sig); if (!sigs.length) throw new Error('informe ao menos um compasso, ex.: 4/4'); const t = mktree(a.r, sigs); return { out: withMeter(VN([...a.r]), t.sigs), info: `${t.nMeas} compasso(s)\n${t.tree}` }; } },
  pulsemaker: { group: 'Métrica', title: 'pulsemaker', desc: 'Divide cada compasso em n pulsos iguais (pulsemaker do OpenMusic). Pulsos negativos viram pausas.',
    ins: [I('sig', 'compassos', 'text', '4/4 3/4 5/8'), I('n', 'pulsos por compasso', 'nums', '4 6 5')], outs: [ROUTM],
    run: (a) => {
      const sigs = parseSigs(a.sig); if (!sigs.length) throw new Error('informe os compassos');
      const r = []; sigs.forEach((sg, i) => { const p = a.n.length ? a.n[Math.min(i, a.n.length - 1)] : sg[0]; const k = Math.max(1, Math.abs(Math.round(p))); for (let j = 0; j < k; j++) r.push((p < 0 ? -1 : 1) * sg[0] / sg[1] / k); });
      return { out: withMeter(VN(r), sigs), info: `${sigs.map((m) => m.join('/')).join(' ')}\n${ratiosInfo(r)}` };
    } },
  compasso: { group: 'Métrica', title: 'compasso', desc: 'Aplica (ou troca) os compassos de um ritmo sem mudar as durações; útil depois de rotatetree, euclides etc.',
    ins: [I('r', 'ritmo', 'nums', '1/4 1/8 1/8 -1/4 1/2'), I('sig', 'compassos', 'text', '7/8')], outs: [ROUTM], ratios: ['r'],
    run: (a) => { const sigs = parseSigs(a.sig); if (!sigs.length) throw new Error('informe os compassos'); const t = mktree(a.r, sigs); return { out: withMeter(VN([...a.r]), t.sigs), info: `${t.nMeas} compasso(s)\n${t.tree}` }; } },
  'get-signatures': { group: 'Métrica', title: 'get-signatures', desc: 'Lê os compassos de um ritmo métrico e os mostra como árvore (tree2ratio inverso).',
    ins: [I('r', 'ritmo', 'nums', '')], outs: [{ id: 'val', label: 'num. compassos', t: 'num' }], ratios: ['r'],
    run: (a) => { const sigs = a.r$meter; if (!sigs) return { val: VN([0]), info: 'o ritmo não tem compasso (use mktree, compasso ou árvore rítmica)' }; const t = mktree(a.r, sigs); return { val: VN([t.nMeas]), info: `${t.sigs.map((m) => m.join('/')).join(' ')}\n${t.tree}` }; } },
  euclides: { group: 'Ritmo geométrico', title: 'euclides', desc: 'Ritmo euclidiano E(k, n): k ataques distribuídos o mais igualmente possível em n pulsos (algoritmo de Bjorklund), com rotação.', necklace: true,
    ins: [I('k', 'ataques k', 'num', 5), I('n', 'pulsos n', 'num', 8), I('rot', 'rotação', 'num', 0), I('unit', 'pulso', 'sel', '0.125', { opts: UNIT_OPTS }), I('mode', 'duração', 'sel', 'pulse', { opts: RMODE_OPTS }), I('rep', 'repetições', 'num', 1)], outs: [ROUT, PLACES],
    run: (a) => {
      const n = Math.max(1, Math.min(96, Math.round(a.n))), k = Math.max(0, Math.min(n, Math.round(a.k)));
      const pat = omRotate(GEO.bjorklund(k, n), a.rot);
      const full = Array.from({ length: Math.max(1, Math.round(a.rep)) }, () => pat).flat();
      const r = GEO.toRatios(full, +a.unit, a.mode), pl = pat.map((x, i) => (x ? i : -1)).filter((i) => i >= 0);
      return { out: VN(r), val: VN(pl), info: `${pat.map((x) => (x ? 'x' : '.')).join('')}\n${ratiosInfo(r)}`,
        neck: { n, onsets: pat, layers: [{ pts: pl }], caption: `E(${k},${n})` } };
    } },
  poligonos: { group: 'Ritmo geométrico', title: 'polígonos', desc: 'Figuras geométricas inscritas num círculo de pulsos: cada número de "figuras" é um polígono regular (3 = triângulo, 4 = quadrado…), com rotação própria. Clique nos pulsos do círculo para desenhar uma figura livre.', necklace: true, editable: 'free',
    ins: [I('n', 'pulsos n', 'num', 12), I('figs', 'figuras (lados)', 'nums', '3 4'), I('rots', 'rotações', 'nums', '0 1'), I('free', 'figura livre', 'nums', ''), I('comb', 'combinar', 'sel', 'union', { opts: [['union', 'união'], ['inter', 'interseção'], ['xor', 'só onde não coincidem']] }), I('unit', 'pulso', 'sel', '0.125', { opts: UNIT_OPTS }), I('mode', 'duração', 'sel', 'pulse', { opts: RMODE_OPTS })], outs: [ROUT, PLACES, { id: 'w', label: 'pesos', t: 'num' }],
    run: (a) => {
      const n = Math.max(1, Math.min(96, Math.round(a.n)));
      const layers = a.figs.map((sd, i) => ({ pts: GEO.polygon(sd, n, a.rots[i] ?? 0) }));
      const free = [...new Set(a.free.map((x) => fmod(Math.round(x), n)))].sort((x, y) => x - y);
      if (free.length) layers.push({ pts: free });
      if (!layers.length) throw new Error('informe ao menos uma figura');
      const cnt = Array(n).fill(0); layers.forEach((L) => L.pts.forEach((i) => cnt[i]++));
      const pat = cnt.map((c) => (a.comb === 'union' ? c > 0 : a.comb === 'inter' ? c === layers.length : c === 1) ? 1 : 0);
      const r = GEO.toRatios(pat, +a.unit, a.mode), pl = pat.map((x, i) => (x ? i : -1)).filter((i) => i >= 0);
      return { out: VN(r), val: VN(pl), w: VN(pl.map((i) => cnt[i])),
        info: `${pat.map((x, i) => (x ? String(cnt[i]) : '.')).join('')}\n${ratiosInfo(r)}`,
        neck: { n, onsets: pat, layers, caption: layers.map((L) => L.pts.length).join('+') } };
    } },
  colar: { group: 'Ritmo geométrico', title: 'colar rítmico', desc: 'Mostra qualquer ritmo (proporções) como um colar de pulsos, para comparar figuras.', necklace: true,
    ins: [I('r', 'ritmo', 'nums', '3/16 3/16 1/8 -1/8 3/16 1/16'), I('unit', 'pulso', 'sel', '0.0625', { opts: UNIT_OPTS })], outs: [PLACES], ratios: ['r'],
    run: (a) => {
      const pat = GEO.fromRatios(a.r, +a.unit); if (pat.length > 96) throw new Error('ritmo longo demais para o colar (máx. 96 pulsos)');
      const pl = pat.map((x, i) => (x ? i : -1)).filter((i) => i >= 0);
      return { val: VN(pl), info: pat.map((x) => (x ? 'x' : '.')).join(''), neck: { n: pat.length, onsets: pat, layers: [{ pts: pl }], caption: `${pl.length}/${pat.length}` } };
    } },
  tietree: { group: 'Ritmo (OM)', title: 'tietree', desc: 'Transforma as pausas em prolongamentos da nota anterior (ligaduras).',
    ins: [I('r', 'ritmo', 'nums', '1/8 -1/8 1/4 -1/8 1/8')], outs: [ROUT], ratios: ['r'],
    run: (a) => { const out = []; a.r.forEach((x) => { if (x < 0 && out.length && out[out.length - 1] > 0) out[out.length - 1] += -x; else out.push(x); }); return { out: VN(out), info: ratiosInfo(out) }; } },
  'remove-rests': { group: 'Ritmo (OM)', title: 'remove-rests', desc: 'Todas as pausas viram notas.',
    ins: [I('r', 'ritmo', 'nums', '1/8 -1/8 1/4 -1/8 1/8')], outs: [ROUT], ratios: ['r'],
    run: (a) => { const out = a.r.map(Math.abs); return { out: VN(out), info: ratiosInfo(out) }; } },
  filtertree: { group: 'Ritmo (OM)', title: 'filtertree', desc: 'Troca por pausas as notas nas posições dadas (0 = primeira nota).',
    ins: [I('r', 'ritmo', 'nums', '1/8 1/8 1/4 1/8 1/8 1/4'), I('places', 'posições', 'nums', '1 3')], outs: [ROUT], ratios: ['r'],
    run: (a) => { let k = -1; const set = new Set(a.places.map(Math.round)); const out = a.r.map((x) => (x > 0 && set.has(++k) ? -x : x)); return { out: VN(out), info: ratiosInfo(out) }; } },
  'get-pulse-places': { group: 'Ritmo (OM)', title: 'get-pulse-places', desc: 'Posições das notas (e das pausas) na sequência de durações; também conta os pulsos (n-pulses).',
    ins: [I('r', 'ritmo', 'nums', '1/8 -1/8 1/4 -1/8 1/8')], outs: [{ id: 'val', label: 'notas', t: 'num' }, { id: 'rests', label: 'pausas', t: 'num' }], ratios: ['r'],
    run: (a) => { const on = [], off = []; a.r.forEach((x, i) => (x > 0 ? on : off).push(i)); return { val: VN(on), rests: VN(off), info: `n-pulses ${on.length} · notas ${on.join(' ')} · pausas ${off.join(' ') || '—'}` }; } },
  'extrair-ritmo': { group: 'Ritmo (OM)', title: 'extrair ritmo', desc: 'Lê o ritmo de uma voz (tree2ratio): durações e pausas entre os ataques.',
    ins: [I('in', 'voz', 'in'), I('tempo', 'tempo ♩', 'num', 72)], outs: [{ id: 'out', label: 'ritmo', t: 'num' }],
    run: (a) => {
      const t = timing(a.in$v); if (!t) throw new Error('a entrada não tem ritmo (use voz)');
      const whole = 4 * 60000 / Math.max(1, a.tempo), q = (ms) => Math.round((ms / whole) * 64) / 64;
      const r = []; let pos = 0;
      t.onsets.forEach((o, i) => { if (o - pos > 1) r.push(-q(o - pos)); const next = i + 1 < t.onsets.length ? t.onsets[i + 1] : o + t.durs[i]; r.push(q(Math.min(t.durs[i], next - o) || t.durs[i])); pos = o + Math.min(t.durs[i], next - o); });
      return { out: VN(r.filter((x) => x)), info: ratiosInfo(r.filter((x) => x)) };
    } },

  // ── Profile (Malt & Baboni Schilingi) ──
  'alea-pertb': { ...PSUB('Perturbação'), title: 'alea-pertb', desc: 'Perturbação aleatória: soma a cada altura um valor entre −range e +range (cents). A semente torna o sorteio reprodutível.',
    ins: [I('in', 'perfil', 'in'), I('range', 'range ¢', 'num', 200), I('seed', 'semente', 'num', 1)], outs: [OUT],
    run: (a) => { const r = rng(a.seed), int = Number.isInteger(a.range); return { out: VC(asMel(needFlat(a.in).map((x) => { const v = -a.range + r() * 2 * a.range; return x + (int ? Math.round(v) : v); }))) }; } },
  'compr/expan': { ...PSUB('Perturbação'), title: 'compr/expan', desc: 'Multiplica os intervalos do perfil: <1 comprime, >1 expande, negativo inverte. Campo opcional ajusta ao campo harmônico.',
    ins: [I('in', 'perfil', 'in'), I('value', 'fator', 'num', 2), I('note', 'campo (opc.)', 'chords', '')], outs: [OUT],
    run: (a) => { const l = needFlat(a.in); return { out: VC(asMel(withField(PF.dxx(l[0], PF.dx(l).map((d) => d * a.value)), a.note.flat()))) }; } },
  'control-pertb': { ...PSUB('Mudança'), title: 'control-pertb', desc: 'Perturbação controlada: soma fator·índice a cada altura (0 = inalterada). Índices mais curtos que o perfil são completados com 0.',
    ins: [I('in', 'perfil', 'in'), I('index', 'índices', 'nums', '0 1 -2 0 0 5 -3'), I('fact', 'fator', 'num', 100)], outs: [OUT],
    run: (a) => ({ out: VC(asMel(needFlat(a.in).map((x, i) => x + Math.round(a.fact * (a.index[i] ?? 0))))) }) },
  'prof-change': { ...PSUB('Mudança'), title: 'prof-change', desc: 'Aplica as direções do perfil guia às alturas. "intervalos": usa os intervalos das alturas; "notas": mantém as classes de altura (troca o intervalo pelo complementar).',
    ins: [I('prof', 'perfil guia', 'chords', '6000 6700 6400 6900 6200'), I('in', 'alturas', 'in'), I('mode', 'modo', 'sel', 'intrv', { opts: [['intrv', 'intervalos'], ['note', 'notas']] })], outs: [OUT],
    run: (a) => {
      const p = PF.dx(a.prof.flat()), l = needFlat(a.in), d = PF.dx(l);
      if (!p.length) throw new Error('o perfil guia precisa de 2 notas ou mais');
      const dir = PF.cyc(p, d.length);
      const nd = a.mode === 'intrv' ? d.map((v, i) => (dir[i] > 0 ? Math.abs(v) : -Math.abs(v))) : d.map((v, i) => (Math.sign(dir[i]) === Math.sign(v) ? v : PF.intCom(v)));
      return { out: VC(asMel(PF.dxx(l[0], nd))) };
    } },
  reflexion: { ...PSUB('Reflexões'), title: 'reflexion', desc: 'Simetria em torno de um eixo: reflete para cima (ou para baixo) as notas do outro lado. "intervalos": espelho exato; "notas": mantém as classes de altura.',
    ins: [I('in', 'perfil', 'in'), I('axis', 'eixo', 'pitch', 'C4'), I('mode', 'modo', 'sel', 'intrv', { opts: [['intrv', 'intervalos'], ['note', 'notas']] }), I('dir', 'direção', 'sel', 'up', { opts: [['up', 'para cima'], ['down', 'para baixo']] })], outs: [OUT],
    run: (a) => {
      const ax = a.axis, up = a.dir === 'up';
      const f = (y) => { const wrong = up ? y < ax : y > ax; if (!wrong) return y; return a.mode === 'intrv' ? 2 * ax - y : ax + PF.intCom(y - ax); };
      return { out: VC(asMel(needFlat(a.in).map(f))) };
    } },
  'double-reflect': { ...PSUB('Reflexões'), title: 'double-reflect', desc: 'Simetria entre duas bordas: o perfil é refletido para dentro do registro, como num espelho duplo.',
    ins: [I('in', 'perfil', 'in'), I('lo', 'borda grave', 'pitch', 'G3'), I('hi', 'borda aguda', 'pitch', 'D5'), I('mode', 'modo', 'sel', 'intrv', { opts: [['intrv', 'intervalos'], ['note', 'notas']] }), I('inclu', 'fora do registro', 'sel', 'yes', { opts: [['yes', 'aproxima da borda'], ['no', 'exclui']] })], outs: [OUT],
    run: (a) => {
      const lo = Math.min(a.lo, a.hi), hi = Math.max(a.lo, a.hi), l = needFlat(a.in);
      if (a.mode === 'intrv') {
        if (hi === lo) return { out: VC(asMel(l.map(() => lo))) };
        return { out: VC(asMel(l.map((y) => { let k = 0; while ((y < lo || y > hi) && k++ < 200) y = y < lo ? 2 * lo - y : 2 * hi - y; return y; }))) };
      }
      const r1 = l.map((y) => (y >= lo ? y : lo + PF.intCom(y - lo)));
      const r2 = r1.map((y) => (y <= hi ? y : hi + PF.intCom(y - hi)));
      return { out: VC(asMel(a.inclu === 'yes' ? PF.transApprox(r2, lo, hi) : PF.compOctave(r2, lo, hi))) };
    } },
  'multi-reflect': { ...PSUB('Reflexões'), title: 'multi-reflect', desc: 'Reflexão entre duas bordas que conserva as direções: o que ultrapassa uma borda reaparece a partir da outra.',
    ins: [I('in', 'perfil', 'in'), I('lo', 'borda grave', 'pitch', 'G3'), I('hi', 'borda aguda', 'pitch', 'D5'), I('note', 'campo (opc.)', 'chords', '')], outs: [OUT],
    run: (a) => {
      const lo = Math.min(a.lo, a.hi), hi = Math.max(a.lo, a.hi);
      const r = needFlat(a.in).map((y) => { let k = 0; while ((y > hi || y < lo) && k++ < 500 && hi > lo) y = y > hi ? lo + (y - hi) : hi - (lo - y); return y; });
      return { out: VC(asMel(withField(r, a.note.flat()))) };
    } },
  'mean-derivation': { ...PSUB('Derivação e integração'), title: 'mean-derivation', desc: 'Simplifica o perfil pela média entre notas consecutivas, repetida gr vezes (cada grau tira uma nota).',
    ins: [I('in', 'perfil', 'in'), I('gr', 'grau', 'num', 1), I('note', 'campo (opc.)', 'chords', '')], outs: [OUT], noTiming: true,
    run: (a) => { let l = needFlat(a.in); for (let g = 0; g < Math.max(1, Math.round(a.gr)) && l.length > 1; g++) l = l.slice(1).map((x, i) => (x + l[i]) / 2); return { out: VC(asMel(withField(l, a.note.flat()))) }; } },
  'pr-interlock': { ...PSUB('Derivação e integração'), title: 'pr-interlock', desc: 'Entrelaça as notas de B entre cada par de A, transpondo-as por oitava para caberem entre as duas (deslocamento de ponto médio, como nas curvas fractais).',
    ins: [I('in', 'A', 'in'), I('b', 'B', 'in'), I('gr', 'profundidade', 'num', 1)], outs: [OUT], noTiming: true,
    run: (a) => {
      let l1 = needFlat(a.in), l2 = a.b.flat(); if (!l2.length) throw new Error('conecte B');
      for (let g = 0; g < Math.max(1, Math.round(a.gr)); g++) { const n = l1.length; l1 = PF.interProfile(l1, l2); l2 = omRotate(l2, n - 1); }
      return { out: VC(asMel(l1)) };
    } },
  derivation: { ...PSUB('Derivação e integração'), title: 'derivation', desc: 'Derivada do perfil (Δ entre notas somado à primeira nota), de ordem gr. A saída ○ guarda as notas iniciais para reconstruir com integration.',
    ins: [I('in', 'perfil', 'in'), I('gr', 'ordem', 'num', 1)], outs: [OUT, { id: 'val', label: 'notas iniciais', t: 'num' }], noTiming: true,
    run: (a) => {
      let l = needFlat(a.in); const gr = Math.max(1, Math.round(a.gr));
      if (l.length <= gr) throw new Error(`o perfil precisa de mais de ${gr} notas`);
      const firsts = PF.primeNotes(l, gr);
      for (let g = 0; g < gr; g++) l = PF.deriv(l, l[0]);
      return { out: VC(asMel(l)), val: VN(firsts) };
    } },
  integration: { ...PSUB('Derivação e integração'), title: 'integration', desc: 'Integral do perfil, de ordem gr. "baricentro" parte da média; "original" reconstrói a partir das notas iniciais vindas de derivation.',
    ins: [I('in', 'perfil', 'in'), I('gr', 'ordem', 'num', 1), I('start', 'início', 'sel', 'baric', { opts: [['baric', 'baricentro'], ['orig', 'original']] }), I('vals', 'notas iniciais', 'nums', '')], outs: [OUT, { id: 'val', label: 'baricentro', t: 'num' }], noTiming: true,
    run: (a) => {
      let l = needFlat(a.in); const gr = Math.max(1, Math.round(a.gr)), vals = [...a.vals];
      if (a.start === 'orig' && vals.length < gr) throw new Error('conecte as notas iniciais de derivation');
      const bar = PF.mean(l);
      for (let g = 0; g < gr; g++) l = PF.integr(l, a.start === 'orig' ? vals.shift() : PF.mean(l));
      return { out: VC(asMel(l)), val: VN([bar]), info: `baricentro ${name12(bar)}` };
    } },
  'inter-dyn': { ...PSUB('Interpolação'), title: 'inter-dyn', desc: 'Interpolação entre dois acordes (ou notas) de mesmo tamanho, com curva opcional e ajuste opcional a um campo harmônico.',
    ins: [I('in', 'início', 'in'), I('end', 'fim', 'chords', '7200 7550 7900'), I('steps', 'passos', 'num', 6), I('tab', 'curva (bpf)', 'nums', ''), I('inclu', 'extremos', 'sel', 'yes', { opts: [['yes', 'incluídos'], ['no', 'excluídos']] }), I('note', 'campo (opc.)', 'chords', '')], outs: [OUT], noTiming: true,
    run: (a) => {
      const b = sortNum(need(a.in)[0]), e = sortNum(a.end[0] || []);
      if (!e.length) throw new Error('informe o acorde final');
      if (e.length !== b.length) throw new Error(`o acorde final precisa de ${b.length} notas`);
      let mid = PF.interDyn(b, e, a.steps, a.tab, false);
      if (a.note.length) mid = mid.map((c, i) => PF.notesChange(c, a.note[i % a.note.length], 48));
      const out = [b, ...mid, e];
      return { out: VC(a.inclu === 'yes' ? out : mid) };
    } },
  'multi-interpol': { ...PSUB('Interpolação'), title: 'multi-interpol', desc: 'Interpola entre todos os elementos consecutivos do perfil (notas ou acordes). Passos em lista são lidos circularmente.',
    ins: [I('in', 'perfil', 'in'), I('steps', 'passos', 'nums', '3'), I('tab', 'curva (bpf)', 'nums', ''), I('note', 'campo (opc.)', 'chords', '6000 6100 6200 6300 6400 6500 6600 6700 6800 6900 7000 7100')], outs: [OUT], noTiming: true,
    run: (a) => {
      const p = need(a.in), steps = a.steps.length ? a.steps : [3], out = [];
      for (let x = 0; x < p.length - 1; x++) {
        const b = sortNum(p[x]), e = sortNum(p[x + 1]);
        const e2 = b.map((_, i) => e[Math.min(i, e.length - 1)]);
        out.push(p[x]);
        let mid = PF.interDyn(b, e2, steps[x % steps.length], a.tab, false);
        if (a.note.length) mid = mid.map((c, i) => PF.notesChange(c, a.note[i % a.note.length], 48));
        out.push(...mid);
      }
      out.push(p[p.length - 1]);
      return { out: VC(out) };
    } },
  'interpol-prof': { ...PSUB('Interpolação'), title: 'interpol-prof', desc: 'Interpola entre dois perfis de tamanhos quaisquer: trata-os como curvas, interpola as curvas e reamostra cada perfil intermediário.',
    ins: [I('in', 'perfil 1', 'in'), I('b', 'perfil 2', 'in'), I('steps', 'passos', 'num', 6), I('nbr', 'notas por perfil', 'nums', ''), I('tab', 'curva (bpf)', 'nums', ''), I('approx', 'aprox.', 'sel', '4', { opts: APPROX }), I('mode', 'saída', 'sel', 'seq', { opts: [['seq', 'perfis em sequência'], ['chords', 'um acorde por perfil']] })], outs: [OUT], noTiming: true,
    run: (a) => {
      const p1 = needFlat(a.in), p2 = a.b.flat(); if (!p2.length) throw new Error('conecte o perfil 2');
      const steps = Math.max(1, Math.round(a.steps)), N = 10 * Math.max(p1.length, p2.length);
      const s1 = PF.resample(p1, N), s2 = PF.resample(p2, N);
      const profs = PF.interDyn(s1, s2, steps, a.tab, true);
      const L = profs.length;
      const counts = profs.map((_, k) => {
        if (k === 0) return p1.length; if (k === L - 1) return p2.length;
        if (a.nbr.length === 1) return Math.max(1, Math.round(a.nbr[0]));
        if (a.nbr.length > 1) return Math.max(1, Math.round(a.nbr[(k - 1) % a.nbr.length]));
        return Math.max(1, Math.round(p1.length + ((p2.length - p1.length) * k) / (L - 1)));
      });
      const res = profs.map((pr, k) => (k === 0 ? p1 : k === L - 1 ? p2 : approxM(PF.resample(pr, counts[k]), +a.approx)));
      return { out: VC(a.mode === 'seq' ? res.flat().map((x) => [x]) : res.map(sortNum)), info: `${L} perfis · ${counts.join(' ')} notas` };
    } },
  'range-approx': { ...PSUB('Utilitários'), title: 'range-approx', desc: 'Transpõe por oitavas as notas para dentro do registro. Fora dele: aproxima da borda ou exclui.',
    ins: [I('in', 'entrada', 'in'), I('lo', 'grave', 'pitch', 'C4'), I('hi', 'agudo', 'pitch', 'C5'), I('inclu', 'fora do registro', 'sel', 'yes', { opts: [['yes', 'aproxima da borda'], ['no', 'exclui']] })], outs: [OUT],
    run: (a) => { const lo = Math.min(a.lo, a.hi), hi = Math.max(a.lo, a.hi); return { out: VC(need(a.in).map((c) => sortNum(a.inclu === 'yes' ? PF.transApprox(c, lo, hi) : PF.compOctave(c, lo, hi)))) }; } },
  'notes-change': { ...PSUB('Utilitários'), title: 'notes-change', desc: 'Ajusta cada altura à classe mais próxima de um campo harmônico, mantendo a oitava. Módulo 12 = semitons, 24 = ¼, 48 = ⅛ de tom.',
    ins: [I('in', 'entrada', 'in'), I('scale', 'campo', 'chords', 'C4 D4 E4 F#4 G#4 A#4'), I('mod', 'módulo', 'sel', '12', { opts: [['12', '12 (½ tom)'], ['24', '24 (¼ tom)'], ['48', '48 (⅛ tom)']] })], outs: [OUT],
    run: (a) => ({ out: VC(need(a.in).map((c) => PF.notesChange(c, a.scale.flat(), +a.mod)), a.in$vels) }) },
  'weight-average': { ...PSUB('Utilitários'), title: 'weight-average', desc: 'Baricentro (média) das alturas.',
    ins: [I('in', 'entrada', 'in')], outs: [OUT, { id: 'val', label: 'valor', t: 'num' }],
    run: (a) => { const m = PF.mean(needFlat(a.in)); return { out: VC([[m]]), val: VN([m]), info: `${name12(m)} · ${hz(mcToF(m))}` }; } },
  'pr-group-list': { ...PSUB('Utilitários'), title: 'pr-group-list', desc: 'Articula a lista em segmentos de tamanhos dados: "stop" linear, "circ" circular, "scal" proporcional.',
    ins: [I('in', 'entrada', 'in'), I('group', 'tamanhos', 'nums', '4 2 1 3'), I('mode', 'modo', 'sel', 'stop', { opts: [['stop', 'stop'], ['circ', 'circ'], ['scal', 'scal']] })], outs: [OUT], noTiming: true,
    run: (a) => {
      const l = needFlat(a.in); let g = a.group.map((x) => Math.max(1, Math.round(x)));
      if (a.mode === 'circ') { const c = PF.cyc(l, g.reduce((s, x) => s + x, 0)); let i = 0; return { out: VC(g.map((k) => sortNum(c.slice(i, (i += k))))) }; }
      if (a.mode === 'scal') { const tot = g.reduce((s, x) => s + x, 0); g = g.map((x) => Math.round((x * l.length) / tot)); }
      const out = []; let i = 0; for (const k of g) { if (i >= l.length) break; out.push(sortNum(l.slice(i, i + k))); i += k; }
      return { out: VC(out) };
    } },
  'subst-list': { ...PSUB('Utilitários'), title: 'subst-list', desc: 'Substitui as ocorrências de uma altura por outra, a partir de uma posição (0 = primeira) e até n vezes.',
    ins: [I('in', 'entrada', 'in'), I('old', 'antiga', 'pitch', 'C4'), I('nw', 'nova', 'pitch', 'C#4+50'), I('start', 'a partir de', 'num', 0), I('count', 'vezes', 'num', 2)], outs: [OUT],
    run: (a) => {
      let left = Math.max(0, Math.round(a.count)), k = 0;
      return { out: VC(need(a.in).map((c) => c.map((x) => { const pos = k++; if (pos >= a.start && left > 0 && Math.abs(x - a.old) < 1) { left--; return a.nw; } return x; })), a.in$vels) };
    } },
  'interpol-tab': { ...PSUB('Utilitários'), title: 'interpol-tab', desc: 'Interpolação entre duas listas de valores com curva opcional (bpf).',
    ins: [I('in', 'início', 'in'), I('end', 'fim', 'chords', '7200 7550 7900'), I('steps', 'passos', 'num', 4), I('tab', 'curva (bpf)', 'nums', '0 0.1 0.3 1'), I('inclu', 'extremos', 'sel', 'yes', { opts: [['yes', 'incluídos'], ['no', 'excluídos']] })], outs: [OUT], noTiming: true,
    run: (a) => {
      const b = sortNum(need(a.in)[0]), e = sortNum(a.end[0] || []);
      if (e.length !== b.length) throw new Error(`o fim precisa de ${b.length} valores`);
      return { out: VC(PF.interDyn(b, e, a.steps, a.tab, a.inclu === 'yes')) };
    } },

  // ── harmonias de Euler ──
  'euler-genus': { group: 'Euler', title: 'gênero de Euler', desc: 'Gênero de N = 3^b·5^c·7^d: todos os divisores de N como parciais da fundamental. Mostra a rede de Euler e o gradus suavitatis.', lattice: true,
    ins: [I('fund', 'fundamental', 'pitch', 'C3'), I('b', 'expoente de 3', 'num', 2), I('c', 'expoente de 5', 'num', 1), I('d', 'expoente de 7', 'num', 0), I('layout', 'disposição', 'sel', 'open', { opts: LAYOUTS }), I('type', 'saída', 'sel', 'chord', { opts: [['chord', 'acorde'], ['seq', 'arpejo (uma nota por vez)']] })],
    outs: [OUT, { id: 'val', label: 'razões', t: 'num' }],
    run: (a) => {
      const b = Math.max(0, Math.min(6, Math.round(a.b))), c = Math.max(0, Math.min(4, Math.round(a.c))), d = Math.max(0, Math.min(2, Math.round(a.d)));
      const dv = EULER.divisors(b, c, d), N = 3 ** b * 5 ** c * 7 ** d;
      const f0 = mcToF(a.fund);
      const pts = dv.map((x) => ({ ...x, r: EULER.place(x.n, a.layout) })).sort((x, y) => x.r - y.r);
      const mcs = pts.map((x) => Math.round(fToMc(f0 * x.r)));
      const out = VC(a.type === 'seq' ? mcs.map((m) => [m]) : [mcs]);
      out.ratios = a.type === 'seq' ? pts.map((x) => [x.r]) : [pts.map((x) => x.r)];
      return { out, val: VN(pts.map((x) => x.r)),
        info: `N = ${EULER.name(b, c, d)} = ${N} · ${dv.length} sons · gradus ${EULER.gradus(N)}\n${pts.map((x) => x.n).join(' ')}`,
        lattice: { b, c, d } };
    } },
  'euler-series': { group: 'Euler', title: 'série de Euler', desc: 'Série dos gêneros 3^b·5^c(·7^d) ordenados pelo gradus suavitatis — do mais simples (gênero I) ao mais complexo, como na tabela do Tentamen.', lattice: true,
    ins: [I('fund', 'fundamental', 'pitch', 'C3'), I('maxg', 'gradus máximo', 'num', 12), I('use7', 'primo 7', 'sel', 'no', { opts: [['no', 'só 3 e 5 (Euler)'], ['yes', 'incluir 7']] }), I('layout', 'disposição', 'sel', 'close', { opts: LAYOUTS }), I('from', 'do nº', 'num', 1), I('count', 'quantos', 'num', 18)],
    outs: [OUT, { id: 'val', label: 'gradus', t: 'num' }],
    run: (a) => {
      const G = Math.max(1, Math.min(30, Math.round(a.maxg))), f0 = mcToF(a.fund), list = [];
      for (let d = 0; d <= (a.use7 === 'yes' ? 3 : 0); d++) for (let c = 0; c <= 6; c++) for (let b = 0; b <= 10; b++) {
        const N = 3 ** b * 5 ** c * 7 ** d, g = EULER.gradus(N);
        if (g <= G) list.push({ b, c, d, N, g });
      }
      list.sort((x, y) => x.g - y.g || x.N - y.N);
      const from = Math.max(1, Math.round(a.from)) - 1, sel = list.slice(from, from + Math.max(1, Math.round(a.count)));
      if (!sel.length) throw new Error('nenhum gênero nesse intervalo');
      const roman = (n) => { const R = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s2 = ''; for (const [v, t] of R) while (n >= v) { s2 += t; n -= v; } return s2; };
      const rat = sel.map((x) => EULER.divisors(x.b, x.c, x.d).map((y) => EULER.place(y.n, a.layout)).sort((p, q) => p - q));
      const chords = rat.map((rr) => rr.map((r) => Math.round(fToMc(f0 * r))));
      const last = sel[sel.length - 1];
      const out = VC(chords); out.ratios = rat;
      return { out, val: VN(sel.map((x) => x.g)),
        info: sel.map((x, i) => `${String(from + i + 1).padStart(2)}. ${EULER.name(x.b, x.c, x.d)} = ${x.N} · gradus ${roman(x.g)} (${x.g})`).join('\n'),
        lattice: { b: Math.max(...sel.map((x) => x.b)), c: Math.max(...sel.map((x) => x.c)), d: Math.max(...sel.map((x) => x.d)), mark: new Set(EULER.divisors(last.b, last.c, last.d).map((y) => y.n)) } };
    } },
  'euler-path': { group: 'Euler', title: 'caminho na rede', desc: 'Percorre a rede de Euler por passos de quinta (±3) e terça (±5): cada passo dá a próxima razão, levada para dentro da oitava.',
    ins: [I('fund', 'fundamental', 'pitch', 'C4'), I('steps', 'passos', 'text', '3 3 5 /3 5 5 /5 3'), I('layout', 'disposição', 'sel', 'scale', { opts: LAYOUTS })], outs: [OUT, { id: 'val', label: 'razões', t: 'num' }],
    run: (a) => {
      let num = 1, den = 1; const rs = [1];
      String(a.steps).split(/[\s,;]+/).filter(Boolean).forEach((t) => {
        const m = /^(\/)?([357])$/.exec(t); if (!m) throw new Error(`passo "${t}" inválido (use 3, 5, 7, /3, /5, /7)`);
        const p = +m[2]; if (m[1]) den *= p; else num *= p;
        const g = EULER.gcd(num, den); num /= g; den /= g; rs.push(num / den);
      });
      const f0 = mcToF(a.fund);
      const placed = rs.map((r) => { if (a.layout === 'open') return r; let x = r; while (x >= (a.layout === 'scale' ? 2 : 4)) x /= 2; while (x < 1) x *= 2; return x; });
      return { out: VC(placed.map((r) => [Math.round(fToMc(f0 * r))])), val: VN(placed), info: `razão final ${num}/${den}` };
    } },
  gradus: { group: 'Euler', title: 'gradus suavitatis', desc: 'Lê cada acorde como razões inteiras (parciais da fundamental virtual, dentro da tolerância) e calcula o gradus suavitatis de Euler do seu MMC.',
    ins: [I('in', 'entrada', 'in'), I('cents', 'tolerância ¢', 'num', 15)], outs: [{ id: 'val', label: 'gradus', t: 'num' }],
    run: (a) => {
      const exact = a.in$v?.ratios && a.in$v.ratios.length === a.in.length ? a.in$v.ratios : null;
      const res = need(a.in).map((c, ci) => {
        if (exact) {
          // razões exatas vindas de um objeto de Euler: leva tudo a inteiros (multiplica pelas potências de 2 necessárias)
          let rr = exact[ci].map((r) => r); let k = 1; while (rr.some((r) => Math.abs(r * k - Math.round(r * k)) > 1e-9) && k < 1 << 20) k *= 2;
          rr = rr.map((r) => Math.round(r * k)); const g0 = rr.reduce((x, y) => EULER.gcd(x, y)); rr = rr.map((x) => x / g0);
          const L = rr.reduce((x, y) => EULER.lcm(x, y), 1);
          return { g: EULER.gradus(L), rr, L };
        }
        const vf = virtualFund(c, { cents: Math.max(1, a.cents) }); if (vf == null) return { g: null };
        const ranks = closestHarm(c, vf, { type: 'ranks' }).map(Math.abs);
        let gg = ranks.reduce((x, y) => EULER.gcd(x, y)); const rr = ranks.map((x) => x / gg);
        const L = rr.reduce((x, y) => EULER.lcm(x, y), 1);
        return { g: EULER.gradus(L), rr, L };
      });
      return { val: VN(res.map((r) => r.g)), info: (exact ? 'razões exatas (vindas de Euler)\n' : 'razões estimadas pela fundamental virtual\n') + res.map((r, i) => (r.g == null ? `${i + 1}: sem solução` : `${i + 1}: ${r.rr.join(':')} · MMC ${r.L} · gradus ${r.g}`)).join('\n') };
    } },

  'r-markov': { group: 'OMRC', sub: 'Regras', title: 'r-markov', desc: 'Cadeia de Markov de 1ª ordem entre células (Paul Nauert): a proporção de cada transição na resposta segue a tabela, dentro da tolerância. Linhas da tabela separadas por ;.',
