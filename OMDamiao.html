  'rc-solver': { group: 'OMRC', sub: 'Solução', title: 'pmc (motor de restrições)', desc: 'Busca com retrocesso: preenche as camadas com células do domínio até a duração pedida, respeitando todas as regras. A semente escolhe entre as soluções possíveis.', rclanes: true, wide: true,
    ins: [I('dom0', 'domínio voz 0', 'rc'), I('dom1', 'domínio voz 1', 'rc'), I('r1', 'regras', 'rc'), I('r2', 'regras', 'rc'), I('r3', 'regras', 'rc'), I('r4', 'regras', 'rc'), I('len', 'duração (semibreves)', 'nums', '3'), I('seed', 'semente', 'num', 1), I('max', 'nós máx.', 'num', 60000)],
    outs: [{ id: 'l1', label: 'voz 0 · camada 1', t: 'num' }, { id: 'l2', label: 'voz 0 · camada 2', t: 'num' }, { id: 'l3', label: 'voz 0 · camada 3', t: 'num' }, { id: 'sol', label: 'solução', t: 'rc' }], ratios: ['len'],
    run: (a, n) => {
      const d0 = domainOf(a.dom0), d1 = domainOf(a.dom1);
      if (!d0) throw new Error('conecte um voice-domain à voz 0');
      const voices = [d0, d1].filter(Boolean), rules = collectRules(a, ['r1', 'r2', 'r3', 'r4']);
      const key = JSON.stringify([voices, rules, a.len, a.seed, a.max]);
      let res = n.memo?.key === key ? n.memo.res : null;
      if (!res) { res = RC.solve(voices, rules, { length: Math.abs(a.len[0] || 1), seed: a.seed, maxNodes: Math.max(100, a.max) }); n.memo = { key, res }; }
      if (!res.ok) throw new Error(res.reason);
      const V = res.voices[0], lay = (l) => { const L = V.layers[l - 1]; if (!L) return null; const v = VN(L.ratios); return V.sigs ? withMeter(v, V.sigs) : v; };
      return { l1: lay(1), l2: lay(2), l3: lay(3), sol: { kind: 'rc', rc: { solution: res }, label: `${res.voices.length} voz(es)` }, rcsol: res,

  'decode-engine': { group: 'OMRC', sub: 'Solução', title: 'decode-engine', desc: 'Lê uma camada de qualquer voz da solução como ritmo (com os compassos da voz). Camada 0 = os compassos.',
    ins: [I('sol', 'solução', 'rc'), I('v', 'voz', 'sel', '0', { opts: [['0', 'voz 0'], ['1', 'voz 1']] }), RLAY('l', 'camada', 1)], outs: [{ id: 'out', label: 'ritmo', t: 'num' }],

      else { const L = V.layers[+a.l - 1]; if (!L) throw new Error(`a voz ${a.v} não tem a camada ${a.l}`); r = L.ratios; }

    ins: [I('in', 'estados / modelo', 'in'), I('mode', 'tabela', 'sel', 'learn', { opts: [['learn', 'aprender da entrada'], ['matrix', 'matriz escrita']] }), I('matrix', 'matriz', 'area', '0 0.5 0.5; 0.3 0 0.7; 0.6 0.4 0'), I('order', 'ordem', 'sel', '1', { opts: [['1', '1ª'], ['2', '2ª']] }), I('prim', 'estado inicial', 'num', 1), I('long', 'tamanho', 'num', 24), SEED], outs: [OUT, { id: 'val', label: 'índices', t: 'num' }],
    run: (a) => {
      const r = rng(a.seed), long = Math.max(1, Math.round(a.long));
      if (a.mode === 'matrix') {
        const M = String(a.matrix).split(/[;\n]+/).map((s) => parseNums(s)).filter((x) => x.length);
        if (!M.length || M.some((row) => row.length !== M.length)) throw new Error('a matriz precisa ser quadrada (linhas separadas por ;)');
        const idx = AL.markov(r, M, Math.max(1, Math.min(M.length, Math.round(a.prim))), long), st = a.in;
        return { val: VN(idx), out: st.length ? VC(idx.map((i) => st[(i - 1) % st.length])) : VC([]), info: idx.join(' ') };
      }
      const data = need(a.in), keys = data.map((c) => sortNum(c).join(' ')), uniqK = [...new Set(keys)].sort((x, y) => parseFloat(x) - parseFloat(y)), states = uniqK.map((k) => k.split(' ').map(Number));
      const codes = keys.map((k) => uniqK.indexOf(k) + 1);
      let idx;
      if (a.order === '2') idx = AL.markov2nd(r, codes, long);
      else { const { M } = AL.anaMark(codes); idx = AL.markov(r, M, Math.max(1, Math.min(states.length, Math.round(a.prim))), long); }
      const { M } = AL.anaMark(codes);
      return { val: VN(idx), out: VC(idx.map((i) => states[i - 1])), info: `estados: ${states.map((s, i) => `${i + 1}=${s.map(name12).join('·')}`).join('  ')}\n` + (states.length <= 8 ? M.map((row) => row.map((v) => v.toFixed(2)).join(' ')).join('\n') : `matriz ${states.length}×${states.length} · sequência ${idx.join(' ')}`) };
    } },
  filtre: { group: 'Alea', sub: 'Utilitários', title: 'filtre', desc: 'Filtra as alturas entre duas bordas: elástica (reflete o que ultrapassa) ou absorvente (prende na borda).',
    ins: [I('in', 'entrada', 'in'), I('lo', 'borda grave', 'pitch', 'C4'), I('hi', 'borda aguda', 'pitch', 'C5'), I('mode', 'borda', 'sel', 'elastic', { opts: [['elastic', 'elástica'], ['absorb', 'absorvente']] })], outs: [OUT],

  'alea-zoom': { group: 'Alea', sub: 'Utilitários', title: 'zoom', desc: 'Leva valores de uma faixa a outra (zoom2/zoom3). Faixa de entrada vazia = mínimo e máximo dos valores. A saída □ trata o resultado como midicents.',

  ifs: { group: 'Chaos', sub: 'Fractais', title: 'IFS', desc: 'Sistemas de funções iteradas (IFSx): aplica as transformações afins a um objeto (pares x y). "deter" aplica todas; "random" sorteia pelas probabilidades. Biblioteca ifs-lib (samambaia, Sierpinski, Cantor…) ou transformações próprias, uma por linha: r s θ1 θ2 e f p (make-w).', extview: true, wide: true,
    ins: [I('lib', 'figura', 'sel', 'fern', { opts: [...Object.keys(CH.IFS_LIB).map((k) => [k, k]), ['custom', 'própria (make-w)']] }), I('w', 'transformações', 'area', '0.5 0.5 0 0 0 0 0.33\n0.5 0.5 0 0 0.5 0 0.33\n0.5 0.5 0 0 0.25 0.5 0.34'), I('ints', 'iterações', 'num', 6), I('obj', 'objeto (x y; …)', 'text', '0 0'), I('ef', 'fator e', 'num', 1), I('ff', 'fator f', 'num', 1), I('mode', 'modo', 'sel', 'random', { opts: [['deter', 'deter'], ['random', 'random']] }), SEED, I('var', 'variável', 'sel', '1', { opts: [['0', 'x'], ['1', 'y']] }), I('n', 'notas', 'num', 64), ...XTI('ordem'), ...MAPI()], outs: [OUT, VALOUT],
    run: (a) => {
      let data = CH.IFS_LIB[a.lib];
      if (a.lib === 'custom') { const ws = String(a.w).split(/[\n;]+/).map((s) => parseNums(s)).filter((x) => x.length >= 6).map((x) => CH.makeW(...x)); if (!ws.length) throw new Error('escreva ao menos uma transformação: r s θ1 θ2 e f p'); data = ws[0].map((_, k) => ws.map((w) => w[k])); }
      const obj = parsePts(a.obj); if (!obj.length) throw new Error('o objeto precisa de pares x y');
      const T = data[0].length; let ints = Math.max(1, Math.round(a.ints)); while (ints > 1 && obj.length * T ** ints > 40000) ints--;
      const pts = CH.ifs(rng(a.seed), data, ints, obj, a.ef, a.ff, a.mode);
      const k = +a.var, vals = pts.map((p) => p[k]);
      return { ...genOut(vals, { ...a }, pts.map((p) => p[1 - k]), Math.max(1, Math.round(a.n))), ext: plotSVG({ pts, caption: `${a.lib} · ${pts.length} pontos${ints < Math.round(a.ints) ? ` (${ints} iter.)` : ''}`, wide: true }) };

  'fract-gen': { group: 'Chaos', sub: 'Fractais', title: 'fract-gen', desc: 'Curva fractal por substituição (fract-gen1): cada segmento da base é trocado por uma cópia escalada e girada do gerador, n vezes. Sem base, o gerador é a própria base (curva de Koch com o padrão).', extview: true,

function pcSets(a, n = 12) {
  if (a.in && a.in.length) return a.in.map((c) => [...new Set(c.map((m) => MT.mod(Math.round(m / (1200 / n)), n)))].sort((x, y) => x - y));
  return String(a.pcs ?? '').split(/[;\n]+/).map((s) => s.trim()).filter(Boolean).map((s) => {
    const toks = /[\s,]/.test(s) ? s.split(/[\s,]+/) : [...s.replace(/[()[\]{}]/g, '')];
    return [...new Set(toks.filter(Boolean).map((t) => { const u = t.toUpperCase(); const v = u === 'T' || u === 'A' ? 10 : u === 'E' || u === 'B' ? 11 : Number(t); if (!Number.isFinite(v)) throw new Error(`classe "${t}" inválida`); return MT.mod(Math.round(v), n); }))].sort((x, y) => x - y);

  });

/** restrição do feuillete: vazio ou -1 = livre; "1/4 1/8" = lista; "b 40 80" = intervalo */
function fconstr(t) {
  const s = String(t ?? '').trim(); if (!s || s === '-1') return null;
  const m = /^b\s+([\d./]+)\s+([\d./]+)$/i.exec(s); const num = (x) => { const q = /^(\d+)\/(\d+)$/.exec(x); return q ? +q[1] / +q[2] : Number(x); };
  if (m) return { lo: num(m[1]), hi: num(m[2]) };
  const vals = s.split(/[\s,]+/).map(num); if (vals.some((v) => !Number.isFinite(v))) throw new Error(`restrição "${s}" inválida`); return { vals };
}

function metricVoice(meas, a) {
  const chords = [], vels = [], onsets = [], durs = [], ratios = [], sigs = [], bars = []; let t = 0;
  meas.forEach((m, mi) => {
    bars.push({ t, sig: m.sig, qpm: 240000 / m.wholeMs, show: mi === 0 || m.sig[0] !== meas[mi - 1].sig[0] || m.sig[1] !== meas[mi - 1].sig[1] });

    }
  });
  bars.push({ t, end: true });
  const out = VC(chords, vels, { onsets, durs, bars, tempo: meas[0]?.tempo || 60, nota: buildNota(ratios, sigs) });
  return { out, r: withMeter(VN(ratios), sigs) };
}

    run: (a) => { const ch = need(a.in), t = timing(a.in$v); const on = t?.onsets || ch.map((_, i) => i * a.ms), du = t?.durs || ch.map(() => a.ms); const ev = CHD.chseqToPoly(ch, on, du, a.in$vels, +a.approx); return { out: polyOut(ev), info: `${ev.length} notas (de ${ch.flat().length})` }; } },
  'graph-tour': { group: 'RepMus', sub: 'Grafos', title: 'make-graph + graph-tour', desc: 'Organiza os acordes num grafo em que o peso de cada ligação é o número de notas relacionadas (por padrão, notas comuns; mk-pred: diferença igual a algum dos valores, com tolerância — ex.: 100 = passo de semitom) e percorre a árvore geradora ótima (Prim) a partir do acorde escolhido. Maximizar = mais relações entre vizinhos; minimizar = máximo contraste. "com elo" acrescenta a nota grave anterior quando não há relação.',
    ins: [I('in', 'acordes', 'in'), I('vals', 'mk-pred: valores ¢', 'nums', '0'), I('tol', 'tolerância ¢', 'num', 0), I('solu', 'solução (acorde inicial, 0…)', 'num', 0), I('link', 'elo', 'sel', '1', { opts: [['1', 'sem elo'], ['2', 'com elo']] }), I('order', 'ordem', 'sel', '1', { opts: [['1', 'maximizar'], ['2', 'minimizar']] }), I('trav', 'percurso', 'sel', '1', { opts: [['1', 'curto'], ['2', 'longo (com repetições)']] })], outs: [OUT], noTiming: true,
    run: (a) => {
      const ch = need(a.in); if (ch.length < 2) throw new Error('são precisos ao menos 2 acordes');
      const pred = GR.mkPred(a.vals.length ? a.vals : [0], Math.max(0, a.tol)), max = a.order === '1';
      const stats = ch.map((_, s) => GR.tour(GR.make(ch, pred), s, false, max, a.trav === '2').score);
      const t = GR.tour(GR.make(ch, pred), Math.round(a.solu), a.link === '2', max, a.trav === '2');
      return { out: VC(t.chords.map(sortNum)), info: `ordem: ${t.order.join(' ')}\notimalidade por solução: ${stats.map((s, i) => `${i}:${s.toFixed(2)}`).join(' ')}` };
    } },
  lc: { group: 'RepMus', sub: 'Crivos (LC)', title: 'lc / eval-crible', desc: 'Linguagem de crivos da RepMus. Uma definição por linha: nome = expressão. (passo deslocamento início fim) é um crivo simples; + união, − interseção, * composição (elementos nas posições do 2º), / diferença, // diferença simétrica (associam à direita); c(x) complementar, d(1 4 9) crivo dado, a(passo início fim) aleatório; p(x c1 c2) cria a partição x1, x2, x12… Saída: os crivos pedidos, como alturas (base + ponto × passo) e como ritmo.', extview: true,
    ins: [I('prog', 'programa', 'area', 'c1 = (3 0 0 47)\nc2 = (4 1 0 47)\nc3 = (7 2 0 47)\nc4 = c1 + c2 / c3\np (x c1 c2)'), I('names', 'avaliar', 'text', 'c4 x12'), I('base', 'base', 'pitch', 'C3'), I('step', 'passo ¢', 'num', 100), I('unit', 'unidade (ms)', 'num', 110), SEED], outs: [OUT, { id: 'val', label: 'crivo', t: 'num' }],
    run: (a) => {
      const L = LCX.run(a.prog, [0, 200], rng(a.seed)), names = String(a.names).trim().split(/\s+/).filter(Boolean); if (!names.length) throw new Error('diga quais crivos avaliar');
      const sv = names.map((n) => { if (!L.env.has(n)) throw new Error(`crivo "${n}" não definido`); return L.env.get(n); });
      const byT = new Map(); sv.forEach((s) => s.forEach((x) => { if (!byT.has(x)) byT.set(x, []); byT.get(x).push(a.base + x * a.step); }));
      const ts = [...byT.keys()].sort((x, y) => x - y), u = Math.max(10, a.unit);
      const N = Math.max(1, ...sv.flat()) + 1;
      return { val: VN(sv[0]), out: VC(ts.map((x) => sortNum([...new Set(byT.get(x))])), null, { onsets: ts.map((x) => x * u), durs: ts.map(() => u * 0.95) }), info: L.order.map((n) => `${n} = ${L.env.get(n).join(' ')}`).join('\n'), ext: canonGridSVG(sv, N, names.join(' · ')) };
    } },
  'crible-list': { group: 'RepMus', sub: 'Crivos (LC)', title: 'crible-list', desc: 'Aplica um crivo LC a uma lista (aqui, a sequência de acordes): fica o elemento de cada posição do crivo. Os crivos simples sem limites vão de 0 ao tamanho da lista.',
    ins: [I('in', 'acordes', 'in'), I('prog', 'programa', 'area', 'c = (3 0) + (5 1)'), I('name', 'crivo', 'text', 'c')], outs: [OUT],
    run: (a) => { const ch = need(a.in), L = LCX.run(a.prog, [0, ch.length - 1]), s = L.env.get(String(a.name).trim()); if (!s) throw new Error('crivo não definido'); return { out: VC(s.filter((i) => i >= 0 && i < ch.length).map((i) => ch[i])), info: s.join(' ') }; } },
  'crible-voice': { group: 'RepMus', sub: 'Crivos (LC)', title: 'crible-voice', desc: 'Aplica um crivo aos pulsos de um ritmo (proporções): os pulsos escolhidos ficam; os outros viram pausa ("silence") ou se ligam ao pulso escolhido anterior ("liaison"). Os crivos simples sem limites vão de 0 ao número de pulsos.',
    ins: [I('r', 'ritmo', 'nums', '1/16 1/16 1/16 1/16 1/16 1/16 1/16 1/16 1/16 1/16 1/16 1/16 1/16 1/16 1/16 1/16'), I('prog', 'programa', 'area', 'c = (3 0) + (5 2)'), I('name', 'crivo', 'text', 'c'), I('mode', 'opção', 'sel', 'silence', { opts: [['silence', 'silence'], ['liaison', 'liaison']] })], outs: [ROUT], ratios: ['r'],
    run: (a) => { const npul = a.r.filter((x) => x > 0).length, L = LCX.run(a.prog, [0, npul - 1]), s = L.env.get(String(a.name).trim()); if (!s) throw new Error('crivo não definido'); const r = LCX.cribleVoice(a.r, s, a.mode === 'liaison'); const v = VN(r); if (a.r$meter) v.meter = a.r$meter; return { out: v, info: ratiosInfo(r) }; } },
  'crible-pitches': { group: 'RepMus', sub: 'Crivos (LC)', title: 'crible-pitches', desc: 'Distribui uma altura para cada crivo: em cada ponto de cada crivo soa a sua altura; pontos comuns viram acordes. O eixo é o tempo (unidade em ms).', extview: true,
    ins: [I('prog', 'programa', 'area', 'a = (3 0 0 23)\nb = (4 1 0 23)\nc = (6 5 0 23)'), I('names', 'crivos', 'text', 'a b c'), I('pitches', 'alturas', 'chords', 'C5 G4 D4'), I('unit', 'unidade (ms)', 'num', 140)], outs: [OUT],
    run: (a) => {
      const L = LCX.run(a.prog), names = String(a.names).trim().split(/\s+/).filter(Boolean), ps = a.pitches.flat(); if (!ps.length) throw new Error('informe as alturas');
      const sv = names.map((n) => { const s = L.env.get(n); if (!s) throw new Error(`crivo "${n}" não definido`); return s; });
      const byT = new Map(); sv.forEach((s, i) => s.forEach((x) => { if (!byT.has(x)) byT.set(x, []); byT.get(x).push(ps[i % ps.length]); }));
      const ts = [...byT.keys()].sort((x, y) => x - y), u = Math.max(10, a.unit), N = Math.max(...ts) + 1;
      return { out: VC(ts.map((x) => sortNum(byT.get(x))), null, { onsets: ts.map((x) => x * u), durs: ts.map(() => u * 0.95) }), ext: canonGridSVG(sv, N, names.join(' · ')) };
    } },
  'rytm-pair': { group: 'RepMus', sub: 'Crivos (LC)', title: 'rytm-pair', desc: 'Ritmo resultante da superposição de periodicidades (3 contra 4 → 3 1 2 2 1 3): durações entre os pontos da união dos múltiplos, até o produto dos períodos.',
    ins: [I('v', 'períodos', 'nums', '3 4'), I('unit', 'unidade', 'nums', '1/16')], outs: [ROUT, VALOUT], ratios: ['unit'],
    run: (a) => { const d = LCX.rytmPair(a.v.map(Math.round).filter((x) => x > 0)), u = Math.abs(a.unit[0] || 1 / 16), r = d.map((x) => x * u); return { out: VN(r), val: VN(d), info: d.join(' ') }; } },
  feuillete: { group: 'RepMus', sub: 'Métricas', title: 'feuillete', desc: 'Feuilleté du tempo (François Nicolas): compassos que obedecem a restrições entre impulsão, pulsação, compasso e velocidade, cada um com valor e tempo. Vazio ou −1 = livre; "1/4 1/8" = uma das opções; "b 40 80" = entre. Pulsações estranhas (5/16) são escritas sobre a semínima com notas ligadas. É preciso fixar algum tempo. Cada solução é um compasso; a voz junta todas (ou só a escolhida).',
    ins: [I('imp', 'impulsão (valor)', 'text', ''), I('timp', 'impulsão (tempo)', 'text', ''), I('puls', 'pulsação (valor)', 'text', '5/16'), I('tpuls', 'pulsação (tempo)', 'text', '72'), I('mes', 'compasso (valor)', 'text', ''), I('tmes', 'compasso (tempo)', 'text', ''), I('vit', 'velocidade', 'text', '1 2 3'), I('npuls', 'pulsações no compasso', 'text', '4'), I('sol', 'solução (0 = todas)', 'num', 0), I('pitch', 'altura', 'pitch', 'C5'), I('acc', 'acento (tempo)', 'pitch', 'G5')], outs: [OUT, ROUT],
    run: (a) => {
      const C = { imp: fconstr(a.imp), timp: fconstr(a.timp), puls: fconstr(a.puls), tpuls: fconstr(a.tpuls), mes: fconstr(a.mes), tmes: fconstr(a.tmes), vit: fconstr(a.vit), npuls: fconstr(a.npuls) };
      if (!C.tpuls && !C.timp && !C.tmes) throw new Error('fixe ao menos um tempo (impulsão, pulsação ou compasso)');
      const sols = MF.feuillete(C, 64); if (!sols.length) throw new Error('nenhuma solução para essas restrições');
      const k = Math.round(a.sol), pick = k > 0 ? [sols[Math.min(sols.length, k) - 1]] : sols, meas = pick.map(MF.measureOf);
      const v = metricVoice(meas, a);
      return { ...v, info: `${sols.length}${sols.length >= 64 ? '+' : ''} soluções\n` + sols.map((s, i) => `S${i + 1}: ${MF.measureOf(s).label}`).join('\n') };
    } },
  'tempo-intp': { group: 'RepMus', sub: 'Métricas', title: 'tempo-intp', desc: 'Interpolação de tempo por modulações métricas: em cada passo, dois compassos mantêm a impulsão enquanto o tempo muda pela razão escolhida (domínio: razões com numerador e denominador até "domínio"). As razões podem ser quaisquer, iguais, crescentes ou decrescentes; a tolerância é o desvio aceito no tempo final.',
    ins: [I('begin', 'tempo inicial', 'num', 60), I('end', 'tempo final', 'num', 200), I('nsteps', 'passos', 'num', 3), I('tol', 'tolerância %', 'num', 30), I('dom', 'domínio', 'num', 5), I('ratio', 'razões', 'sel', '1', { opts: [['1', 'quaisquer'], ['2', 'iguais'], ['3', 'crescentes'], ['4', 'decrescentes']] }), I('sol', 'solução', 'num', 1), I('pitch', 'altura', 'pitch', 'C5'), I('acc', 'acento (tempo)', 'pitch', 'G5')], outs: [OUT, ROUT],
    run: (a) => {
      const curve = { 1: null, 2: 0, 3: 1, 4: -1 }[a.ratio], sols = MF.tempoIntp(Math.max(1, a.begin), Math.max(1, a.end), Math.max(2, Math.min(8, Math.round(a.nsteps))), Math.max(0, a.tol), Math.max(2, Math.min(9, Math.round(a.dom))), curve, 200);
      if (!sols.length) throw new Error('nenhuma solução: aumente a tolerância, o domínio ou os passos');
      const s = sols[Math.max(1, Math.min(sols.length, Math.round(a.sol))) - 1], v = metricVoice(s.meas, a);
      return { ...v, info: `${sols.length} soluções\n` + sols.slice(0, 40).map((x, i) => `${i + 1}: ${x.ratios.map(MF.qs).join(' ')} → ${x.tempos.map((t) => +t.toFixed(1)).join(' ')}`).join('\n') + `\n— compassos da solução ${sols.indexOf(s) + 1}:\n${s.meas.map((m) => m.label).join('\n')}` };
    } },
  'metric-modulation': { group: 'RepMus', sub: 'Métricas', title: 'metric-modulation-ratios', desc: 'Sequência de modulações métricas a partir de um tempo inicial e de uma lista de razões (4/3 = o novo tempo é 4/3 do anterior): para cada razão, dois compassos que preservam a impulsão.',
    ins: [I('begin', 'tempo inicial', 'num', 63), I('rs', 'razões', 'text', '4/3 5/4 6/5 4/3 3/4 2/3 3/4'), I('pitch', 'altura', 'pitch', 'C5'), I('acc', 'acento (tempo)', 'pitch', 'G5')], outs: [OUT, ROUT],
    run: (a) => { const rs = String(a.rs).split(/[\s,]+/).filter(Boolean).map((x) => { const q = MF.qFromNum(/\//.test(x) ? +x.split('/')[0] / +x.split('/')[1] : +x); if (!q || q[0] <= 0) throw new Error(`razão "${x}" inválida`); return q; }); const meas = MF.ratiosSeq(Math.max(1, a.begin), rs); return { ...metricVoice(meas, a), info: meas.map((m) => m.label).join('\n') }; } },
  'as->om': { group: 'RepMus', sub: 'Análise espectral', title: 'as->om', desc: 'Converte a análise de parciais do AudioSculpt (Export Partials, texto "( PARTIALS n ( POINTS k t f a …) …)") numa sequência de acordes: amplitudes viram velocities, ataques próximos (janela delta) se juntam em acordes e a polifonia é reduzida aos parciais mais fortes.',
    ins: [I('txt', 'análise (texto)', 'area', '( PARTIALS 4\n( POINTS 2\n0.00 130.8 0.9\n1.20 131.0 0.6 )\n( POINTS 2\n0.01 261.9 0.5\n0.90 262.3 0.3 )\n( POINTS 2\n0.60 392.5 0.7\n1.40 393.0 0.4 )\n( POINTS 2\n0.61 659.0 0.3\n1.10 660.1 0.2 ) )'), I('vmin', 'vel. mín.', 'num', 40), I('vmax', 'vel. máx.', 'num', 100), I('delta', 'janela ms', 'num', 50), I('mmin', 'grave', 'pitch', 'C2'), I('mmax', 'agudo', 'pitch', 'C8'), I('approx', 'aprox.', 'sel', '8', { opts: APPROX }), I('npoly', 'polifonia', 'num', 10)], outs: [OUT],
    run: (a) => { const P = ASX.parse(a.txt); if (!P.length) throw new Error('nenhum parcial (procure blocos POINTS)'); const g = ASX.toChords(P, { vmin: a.vmin, vmax: a.vmax, delta: a.delta, mmin: a.mmin, mmax: a.mmax, approx: +a.approx, npoly: Math.max(1, Math.round(a.npoly)) }); return { out: VC(g.map((x) => x.notes.map((n) => n.m)), g.map((x) => x.notes.map((n) => n.v)), { onsets: g.map((x) => x.onset), durs: g.map((x) => Math.max(...x.notes.map((n) => n.d))) }), info: `${P.length} parciais → ${g.length} acordes` }; } },

  // ═════════════ ESQUISSE (funções do PatchWork) ═════════════
  'inter->chord': { group: 'Esquisse', sub: 'Intervalos', title: 'inter->chord', desc: 'Constrói um acorde a partir de uma nota base somando os intervalos (em semitons, positivos ou negativos; decimais = microintervalos). "inter": base + notas; "notas": só as notas calculadas.',
    ins: [I('base', 'base', 'pitch', 'C4'), I('ints', 'intervalos', 'nums', '4 7 10 14'), I('format', 'saída', 'sel', 'inter', { opts: [['inter', 'base + notas'], ['notes', 'só as notas']] })], outs: [OUT],
    run: (a) => ({ out: VC([sortNum(EQ.interToChord(a.base, a.ints, a.format))]) }) },
  'chord->inter': { group: 'Esquisse', sub: 'Intervalos', title: 'chord->inter', desc: 'Intervalos (em semitons; 0.5 = quarto de tom) entre a primeira nota e as seguintes. "notas" inclui o 0 da primeira.',
    ins: [I('in', 'acordes', 'in'), I('format', 'saída', 'sel', 'inter', { opts: [['inter', 'só intervalos'], ['notes', 'com 0 inicial']] })], outs: [VALOUT],
    run: (a) => { const r = need(a.in).map((c) => EQ.chordToInter(sortNum(c), a.format)); return { val: VN(r[0]), info: r.map((x) => x.join(' ')).join('\n') }; } },
  'find-intervals': { group: 'Esquisse', sub: 'Intervalos', title: 'find-intervals', desc: 'Busca acordes de n notas (semitons a partir de 0, dentro de ±âmbito) cujos intervalos entre notas vizinhas estão na lista, sem nenhum intervalo proibido entre quaisquer duas notas, incluindo as notas fixas. (Reconstruído a partir do manual do Esquisse para PatchWork.)',
    ins: [I('amb', 'âmbito ± (semitons)', 'num', 12), I('ints', 'intervalos permitidos', 'nums', '3 4 5'), I('forbid', 'proibidos', 'nums', '1 11 6'), I('n', 'notas', 'num', 4), I('max', 'máx. soluções', 'num', 24), I('fixed', 'fixas', 'nums', ''), I('base', 'base (0)', 'pitch', 'C4')], outs: [OUT],
    run: (a) => { const r = EQ.findIntervals(Math.max(1, Math.min(36, Math.round(a.amb))), a.ints.map(Math.round), a.forbid.map((x) => Math.abs(Math.round(x))), Math.max(1, Math.round(a.n)), Math.max(1, Math.min(500, Math.round(a.max))), a.fixed.map(Math.round)); if (!r.length) throw new Error('nenhuma solução'); return { out: VC(r.map((s) => s.map((x) => a.base + x * 100))), info: r.map((s) => s.join(' ')).join('\n') }; } },
  'remove-int': { group: 'Esquisse', sub: 'Intervalos', title: 'remove-int', desc: 'Elimina um intervalo proibido (em midicents) do acorde: apaga a nota superior de cada par que o forma — ou, com "substituir", move-a para formar o intervalo de substituição. "oitavas" também pega os intervalos compostos. Limites opcionais restringem a operação a uma região.',
    ins: [I('in', 'acordes', 'in'), I('forbid', 'proibido(s) ¢', 'nums', '100'), I('replace', 'substituir por ¢ (opc.)', 'nums', ''), I('octave', 'compostos', 'sel', 'no', { opts: [['no', 'só o intervalo'], ['yes', 'também + oitavas']] }), I('inf', 'de (opc.)', 'opitch', ''), I('sup', 'até (opc.)', 'opitch', '')], outs: [OUT],
    run: (a) => ({ out: VC(need(a.in).map((c) => EQ.removeInt(c, a.forbid, a.replace.length ? a.replace[0] : null, a.inf, a.sup, a.octave === 'yes'))) }) },
  transpoct: { group: 'Esquisse', sub: 'Intervalos', title: 'transpoct', desc: 'Transpõe por oitavas as notas para dentro de [mín, máx]; com pivô, deixa todas a menos de meia oitava da nota pivô.',
    ins: [I('in', 'acordes', 'in'), I('min', 'mín.', 'pitch', 'C4'), I('max', 'máx.', 'pitch', 'C6'), I('pivot', 'pivô (opc.)', 'opitch', '')], outs: [OUT],
    run: (a) => { if (a.pivot == null && a.max - a.min < 1200) throw new Error('o âmbito precisa de ao menos uma oitava'); return { out: ESQ_OUT(need(a.in).map((c) => sortNum(EQ.transpoct(c, a.min, a.max, a.pivot))), a) }; } },
  'mul-chord': { group: 'Esquisse', sub: 'Intervalos', title: 'mul-chord', desc: 'Reproduz a estrutura intervalar do acorde 2 sobre cada nota do acorde 1 (multiplicação de acordes à Boulez).',
    ins: [I('in', 'acorde 1', 'in'), I('ch2', 'acorde 2', 'chords', '6000 6100 6600'), TYPE_SEL('chord')], outs: [OUT],
    run: (a) => { const s = a.ch2[0] || [6000], b = Math.min(...s); const r = need(a.in).map((c) => c.map((x) => s.map((y) => x + y - b))); return { out: VC(a.type === 'chord' ? r.map((x) => sortNum([...new Set(x.flat())])) : r.flat().map(sortNum)) }; } },
  'auto-transp': { group: 'Esquisse', sub: 'Intervalos', title: 'auto-transp', desc: 'Todas as transposições do acorde que contêm a primeira nota (cada nota é levada sobre ela); opcionalmente rebatidas por oitavas para dentro de [mín, máx].',
    ins: [I('in', 'acorde', 'in'), I('output', 'original', 'sel', 'inclu', { opts: [['inclu', 'incluído'], ['exclu', 'excluído']] }), I('min', 'mín. (opc.)', 'opitch', ''), I('max', 'máx. (opc.)', 'opitch', '')], outs: [OUT], noTiming: true,
    run: (a) => ({ out: VC(EQ.autoTransp(sortNum(need(a.in)[0]), a.output === 'inclu', a.min, a.max).map(sortNum)) }) },
  'exist-note?': { group: 'Esquisse', sub: 'Análise', title: 'exist-note?', desc: 'A primeira nota do acorde com a mesma classe de altura da nota procurada (qualquer oitava), ou nada.',
    ins: [I('in', 'acordes', 'in'), I('note', 'nota(s)', 'chords', 'E4')], outs: [VALOUT],
    run: (a) => { const ns = a.note.flat(), r = need(a.in).map((c) => ns.map((n) => c.find((x) => ((x - n) % 1200 + 1200) % 1200 === 0) ?? null)); return { val: VN(r.flat()), info: r.map((x) => x.map((m) => (m == null ? 'nil' : name12(m))).join(' ')).join('\n') }; } },
  'midi-center': { group: 'Esquisse', sub: 'Análise', title: 'midi-center', desc: 'Ponto médio exato (em midicents) entre a nota mais grave e a mais aguda.',
    ins: [I('in', 'acordes', 'in')], outs: [OUT, VALOUT],
    run: (a) => { const c = need(a.in).map((x) => (Math.min(...x) + Math.max(...x)) / 2); return { out: VC(c.map((x) => [x])), val: VN(c), info: c.map(name12).join(' ') }; } },

// ════════════════════════════════════════════════════════════════
//  Exportação para o Ableton Live 12: afinação .ascl + MIDI por graus da escala,
//  mapa de tempo e compassos, fim na barra, um arquivo por fluxo
// ════════════════════════════════════════════════════════════════
const ABL = {
  PPQ: 480,
  /** nome de classe de altura sem oitava: "E-14", "C#+50" */
  pcName(pc) { const n = name12(6000 + pc); return n.replace(/(-?\d+)(?=[+-]\d+$|$)/, '').replace(/^([A-G]#?)$/, '$1'); },
  fmtCents(c) { const s = (Math.round(c * 10000) / 10000).toFixed(4).replace(/0+$/, ''); return s.endsWith('.') ? s + '0' : s; },
  /**
   * Afinação: classes de altura usadas (ou grade completa de N-EDO), ancoradas na menor classe.
   * Devolve { N, pcs (relativas a 0..1200), pc0, deg(mc) → grau absoluto, edo }
   */
  tuning(allMc, res, scaleMode) {
    if (res === 12) return { N: 12, std: true, deg: (mc) => Math.round(mc / 100) };
    const grid = res ? 1200 / res : 0.01;
    const q = (mc) => Math.round(mc / grid) * grid;
    let pcs;
    if (scaleMode === 'edo' && res) pcs = Array.from({ length: res }, (_, i) => i * grid);
    else pcs = [...new Set(allMc.map((m) => Math.round((((q(m) % 1200) + 1200) % 1200) * 1000) / 1000).map((x) => (x >= 1200 - 1e-6 ? 0 : x)))].sort((a, b) => a - b);
    const pc0 = pcs[0], rel = pcs.map((p) => p - pc0), N = pcs.length;
    const deg = (mc) => {
      const x = q(mc) - pc0, k = Math.floor((x + 1e-6) / 1200), r = x - k * 1200;
      let best = 0; rel.forEach((p, i) => { if (Math.abs(p - r) < Math.abs(rel[best] - r)) best = i; });
      if (Math.abs(1200 - r) < Math.abs(rel[best] - r)) return (k + 1) * N;
      return k * N + best;
    };
    return { N, pcs, pc0, rel, deg, res };
  },
  ascl(T, minDeg, title) {
    const L = [];
    L.push(`! ${title}.ascl`, '!', `${title} — ${T.N} notas por oitava (OMDamião)`, ` ${T.N}`, '!');
    T.rel.slice(1).forEach((c) => L.push(` ${ABL.fmtCents(c)}`));
    L.push(' 2/1', '!');
    const kref = 5; // grau 0 da oitava 5 = classe pc0 na oitava de dó central (mc 6000 + pc0)
    L.push(`! @ABL REFERENCE_PITCH ${kref} 0 ${mcToF(6000 + T.pc0).toFixed(6)}`);
    L.push(`! @ABL NOTE_NAMES ${T.pcs.map((p) => ABL.pcName(p)).join(' ')}`);
    const o = Math.floor(minDeg / T.N), i = minDeg - o * T.N;
    L.push(`! @ABL NOTE_RANGE_BY_INDEX ${o} ${i}`);
    L.push('! @ABL SOURCE OMDamião (patcher de composição assistida)');
    return L.join('\n') + '\n';
  },
  /** ms → batidas (semínimas) por um mapa de tempo [{t, qpm}] */
  beatMap(segs) {
    const s = segs.slice().sort((a, b) => a.t - b.t); if (!s.length || s[0].t > 0) s.unshift({ t: 0, qpm: s[0]?.qpm || 60 });
    const acc = [0]; for (let k = 1; k < s.length; k++) acc.push(acc[k - 1] + ((s[k].t - s[k - 1].t) * s[k - 1].qpm) / 60000);
    return { segs: s, beats(ms) { let k = s.length - 1; while (k > 0 && s[k].t > ms) k--; return acc[k] + ((ms - s[k].t) * s[k].qpm) / 60000; }, at: acc };
  },
  /**
   * secs: [{name, chords, vels, onsets, durs, bars, tempo}]
   * opts: {res (0 exato | 24 | 48 | 12), scaleMode ('used'|'edo'), time ('real'|'free'|'quant'), grid (fração de semibreve), tempo, chordMs, base}
   */
  build(secs, o) {
    const PPQ = ABL.PPQ, files = [], notesAll = [];
    secs.forEach((sec) => sec.chords.forEach((c) => c.forEach((m) => notesAll.push(m))));
    const T = ABL.tuning(notesAll, o.res, o.scaleMode);
    const degs = notesAll.map(T.deg), dMin = Math.min(...degs), dMax = Math.max(...degs);
    let minDeg = 0, warn = '';
    if (!T.std) {
      if (dMax - dMin > 127) throw new Error(`a música ocupa ${dMax - dMin + 1} graus da escala, mais que as 128 notas MIDI — use "só as alturas usadas" ou uma grade menor`);
      minDeg = dMin - Math.floor((127 - (dMax - dMin)) / 2);
    }
    const key = (mc) => (T.std ? Math.max(0, Math.min(127, T.deg(mc))) : T.deg(mc) - minDeg);
    secs.forEach((sec, si) => {
      // mapa de tempo da seção
      const fixedT = o.time === 'free' ? 60 : o.tempo || sec.tempo || 60;
      let segs = [{ t: 0, qpm: fixedT }];
      if (o.time !== 'free' && sec.bars && sec.bars.some((b) => b.qpm)) segs = sec.bars.filter((b) => b.qpm).map((b) => ({ t: b.t, qpm: b.qpm }));
      const bm = ABL.beatMap(segs), tick = (ms) => Math.round(bm.beats(ms) * PPQ);
      const ev = [], nm = `${sec.name}`;
      ev.push({ tick: 0, ord: 0, bytes: [0xff, 0x03, ...MIDI.vlq(MIDI.str(nm).length), ...MIDI.str(nm)] });
      bm.segs.forEach((sg) => ev.push({ tick: tick(sg.t), ord: 0, bytes: [0xff, 0x51, 0x03, ...MIDI.u32(Math.round(60000000 / sg.qpm)).slice(1)] }));
      const sigEv = [];
      if (o.time !== 'free' && sec.bars && sec.onsets) sec.bars.filter((b) => b.sig).forEach((b, i, arr) => { if (i > 0 && arr[i - 1].sig[0] === b.sig[0] && arr[i - 1].sig[1] === b.sig[1]) return; sigEv.push({ tk: tick(b.t), sig: b.sig }); });
      if (!sigEv.length) sigEv.push({ tk: 0, sig: [4, 4] });
      sigEv.forEach((s) => ev.push({ tick: s.tk, ord: 0, bytes: [0xff, 0x58, 0x04, s.sig[0], Math.round(Math.log2(s.sig[1])), 0x18, 0x08] }));
      // notas
      const gq = o.time === 'quant' ? Math.max(1, Math.round(PPQ * 4 * o.grid)) : 1;
      const Q = (t) => Math.round(t / gq) * gq;
      let lastTk = 0, n = 0;
      sec.chords.forEach((c, i) => {
        const on = sec.onsets ? sec.onsets[i] : i * o.chordMs, du = sec.durs ? sec.durs[i] : o.chordMs * 0.95;
        const a0 = Q(tick(on)), a1 = Math.max(a0 + gq, Q(tick(on + du)));
        c.forEach((mc, j) => {
          const k = key(mc), vel = Math.max(1, Math.min(127, Math.round(sec.vels?.[i]?.[j] ?? 100)));
          ev.push({ tick: a0, ord: 4, bytes: [0x90, k, vel] }, { tick: a1, ord: 3, bytes: [0x80, k, 0] }); n++;
        });
        lastTk = Math.max(lastTk, a1);
      });
      // fim do arquivo na barra seguinte (o clip fica com tamanho de compassos inteiros)
      const lastSig = sigEv.filter((s) => s.tk <= lastTk).pop() || sigEv[0], barStart = lastSig.tk, barLen = Math.round((PPQ * 4 * lastSig.sig[0]) / lastSig.sig[1]);
      const endTk = barStart + Math.ceil((Math.max(lastTk, barStart + 1) - barStart) / barLen) * barLen;
      ev.sort((x, y) => x.tick - y.tick || x.ord - y.ord);
      const out = []; let last = 0;
      for (const e of ev) { out.push(...MIDI.vlq(Math.max(0, e.tick - last)), ...e.bytes); last = Math.max(last, e.tick); }
      out.push(...MIDI.vlq(Math.max(0, endTk - last)), 0xff, 0x2f, 0x00);
      const bytes = new Uint8Array([...MIDI.chunk('MThd', [...MIDI.u16(0), ...MIDI.u16(1), ...MIDI.u16(PPQ)]), ...MIDI.chunk('MTrk', out)]);
      files.push({ name: `${o.base}-${sec.label || String.fromCharCode(65 + si)}.mid`, data: bytes, info: `${nm}: ${n} notas · ${bm.segs.length > 1 ? `${bm.segs.length} tempos` : `♩=${+bm.segs[0].qpm.toFixed(2)}`} · ${Math.round(endTk / PPQ)} tempos (semínimas)` });
    });
    let ascl = null;
    if (!T.std) { ascl = ABL.ascl(T, minDeg, o.base); files.push({ name: `${o.base}.ascl`, data: new TextEncoder().encode(ascl) }); }
    const readme = [
      `${o.base} — exportado do OMDamião para o Ableton Live 12`,
      '',
      T.std ? 'Afinação: 12-TET padrão (nenhum arquivo .ascl necessário).' : `Afinação: ${o.base}.ascl — ${T.N} notas por oitava (${o.scaleMode === 'edo' ? `grade completa de ${T.N}-EDO` : 'só as classes de altura usadas'}). As notas MIDI são graus dessa escala, sem pitch bend.`,
      '',
      'No Live:',
      T.std ? '1. Arraste cada .mid para uma trilha MIDI.' : `1. Arraste ${o.base}.ascl para o set (ou abra-o pelo navegador do Live): o set passa a usar essa afinação.`,
      T.std ? '' : '2. Use instrumentos nativos (Drift, Wavetable, Operator, Meld, Sampler…) ou plugins compatíveis com MPE; o Live retuna cada nota.',
      `${T.std ? '2' : '3'}. Arraste cada .mid (um por fluxo: ${files.filter((f) => f.name.endsWith('.mid')).map((f) => f.name).join(', ')}) para a Arrangement ou para um slot da Session.`,
      `${T.std ? '3' : '4'}. Se o Live perguntar se deve importar o tempo do arquivo, responda Sim: o mapa de tempo vai para a automação de tempo da trilha Master.`,
      '',
      'Os arquivos terminam na barra seguinte à última nota, para os clips fazerem loop em compassos inteiros.',
      o.time === 'free' ? 'Tempo livre: 60 BPM, 1 tempo = 1 segundo.' : o.time === 'quant' ? `Ataques quantizados na grade de ${fracStr(o.grid)} de semibreve.` : 'Tempo: o da voz (ou o mapa de tempo dos compassos).',
      '',
      'Atenção: ao exportar MIDI de dentro do Live, a afinação não vai junto — guarde o .ascl com os arquivos.',
    ].filter((x, i, arr) => !(x === '' && arr[i - 1] === '')).join('\n');
    files.push({ name: 'LEIA-ME.txt', data: new TextEncoder().encode(readme) });
    return { files, T, minDeg, ascl, warn, summary: files.filter((f) => f.info).map((f) => f.info).join('\n') };
  },
};

const GROUPS = ['Fontes', 'Euler', 'Tonnetz', 'OMRC', 'Melodia (OM)', 'Ritmo (OM)', 'Métrica', 'Ritmo geométrico', 'Profile', 'Séries harmônicas', 'Modulação', 'Distorção e deslocamento', 'Outros tratamentos', 'Intervalos', 'Conjuntos', 'Análise', 'Visualizar', 'Esquisse', 'Alea', 'Chaos', 'OM-JI', 'Forte', 'MathTools', 'RepMus'];
const PORTED = (t) => t === 'in' || t === 'chords' || t === 'pitch' || t === 'opitch' || t === 'num' || t === 'nums' || t === 'rc' || t === 'rccells' || t === 'rcsigs';
const DIAMOND = (t) => t === 'rc' || t === 'rccells' || t === 'rcsigs';
const SQUARE = (t) => t === 'in' || t === 'chords';

// ════════════════════════════════════════════════════════════════
//  grafo
// ════════════════════════════════════════════════════════════════
const graph = { nodes: new Map(), cables: [], nextId: 1, z: 60 };
const canvas = $('canvas'), content = $('content'), desktop = $('desktop'), cablesSvg = $('cables');
// ─────────── zoom: o conteúdo é escalado por transform; #canvas é o dimensionador da rolagem ───────────
const ZMIN = 0.25, ZMAX = 2.5;
let zoom = 1;
try { const z = +localStorage.getItem('omtristan-zoom'); if (Number.isFinite(z) && z > 0) zoom = Math.min(ZMAX, Math.max(ZMIN, z)); } catch {}
const isDesk = (el) => el === canvas || el === content || el === cablesSvg;
/** ponto da tela → coordenadas do patch (sem escala) */
function toContent(clientX, clientY) { const c = canvas.getBoundingClientRect(); return [(clientX - c.left) / zoom, (clientY - c.top) / zoom]; }
let focused = null;

function addNode(type, x, y, params = {}, id = null, extra = {}) {
  const def = DEFS[type];
  if (!def) return null;
  const n = { id: id || `n${graph.nextId++}`, type, def, x, y, params: {}, vals: {}, ui: {}, shaded: !!extra.shaded };
  if (id) { const k = Number(String(id).slice(1)); if (k >= graph.nextId) graph.nextId = k + 1; }
  for (const [k, v] of Object.entries(params || {})) n.params[k] = v;
  def.ins.forEach((p) => (n.params[p.id] = params[p.id] ?? p.def ?? ''));
  graph.nodes.set(n.id, n);
  buildNode(n);
  return n;
}

function buildNode(n) {
  const def = n.def;
  const body = h('div', { class: 'gwin-body' });
  const win = h('div', { class: 'gwin' + (def.wide ? ' wide' : '') + (n.shaded ? ' shaded' : ''), id: n.id, style: `left:${n.x}px;top:${n.y}px;z-index:${++graph.z}`, role: 'group', 'aria-label': def.title },
    h('div', { class: 'gwin-bar' },
      h('button', { class: 'gbtn', title: 'Fechar', 'aria-label': 'Fechar', 'data-act': 'close', text: '×' }),
      h('span', { class: 'gwin-title', text: def.title }),
      h('button', { class: 'gbtn', title: 'Recolher', 'aria-label': 'Recolher', 'data-act': 'shade', text: '▾' })),
    body);
  n.el = win;
  body.append(h('p', { class: 'gdesc', text: def.desc }));
  n.ui.rows = {};
  for (const p of def.ins) {
    if (p.t === 'numfield') continue;

let menuStack = [], openBtn = null, deskPanel = null;
function closeMenus() {

}
function runItem(it) { closeMenus(); it.act && it.act(); }
function renderPopup(items, x, y, level) {
  menuStack.slice(level).forEach((m) => m.remove());
  menuStack = menuStack.slice(0, level);
  const menu = h('div', { class: 'gem-menu', role: 'menu' });
  items.forEach((it) => {
    if (it.sep) return menu.append(h('div', { class: 'menusep', role: 'separator' }));
    if (it.grp) return menu.append(h('div', { class: 'grp', text: it.grp }));
    const b = h('button', { class: 'opt' + (it.sub ? ' submenu' : ''), role: it.checked == null ? 'menuitem' : 'menuitemradio', 'aria-checked': it.checked == null ? null : String(it.checked), 'aria-haspopup': it.sub ? 'menu' : null, type: 'button' },
      h('span', { class: 'lbl', text: it.label }), it.sub ? h('span', { class: 'arr', text: '▸' }) : it.k ? h('span', { class: 'k', text: it.k }) : null);
    const openSub = () => {
      menu.querySelectorAll('.opt.cur').forEach((o) => o.classList.remove('cur'));
      if (!it.sub) { menuStack.slice(level + 1).forEach((m) => m.remove()); menuStack = menuStack.slice(0, level + 1); return; }
      b.classList.add('cur');
      const r = b.getBoundingClientRect();
      renderPopup(it.sub, r.right - 4, r.top - 2, level + 1);
    };
    b.addEventListener('pointerenter', openSub);
    onTap(b, () => (it.sub ? openSub() : runItem(it)));
    b.addEventListener('keydown', (e) => {
      const opts = [...menu.querySelectorAll('.opt')], i = opts.indexOf(b);
      if (e.key === 'ArrowDown') { opts[(i + 1) % opts.length].focus(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { opts[(i - 1 + opts.length) % opts.length].focus(); e.preventDefault(); }
      else if (e.key === 'ArrowRight' && it.sub) { openSub(); menuStack[level + 1]?.querySelector('.opt')?.focus(); e.preventDefault(); }
      else if (e.key === 'ArrowLeft' && level > 0) { menuStack[level - 1].querySelector('.opt.cur')?.focus(); menuStack.pop().remove(); e.preventDefault(); }
    });
    menu.append(b);
  });
  document.body.append(menu);
  const w = menu.offsetWidth, hh = menu.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  let left = x, top = y;
  if (left + w > vw - 4) left = level > 0 ? Math.max(4, x - w - (menuStack[level - 1]?.offsetWidth || 0) + 8) : Math.max(4, vw - w - 4);
  if (top + hh > vh - 4) top = Math.max(4, vh - hh - 4);

}

function arrange() {
  const depth = new Map();
  for (const id of topo()) {
    const ups = graph.cables.filter((c) => c.to.n === id).map((c) => (depth.get(c.from.n) ?? 0) + 1);
    depth.set(id, ups.length ? Math.max(...ups) : 0);
  }
  const cols = new Map();
  [...graph.nodes.values()].sort((a, b) => a.y - b.y).forEach((n) => { const d = depth.get(n.id) || 0; (cols.get(d) || cols.set(d, []).get(d)).push(n); });
  let x = 40;
  [...cols.keys()].sort((a, b) => a - b).forEach((d) => {
    let y = 30, w = 0;
    cols.get(d).forEach((n) => { n.x = x; n.y = y; n.el.style.left = x + 'px'; n.el.style.top = y + 'px'; y += n.el.offsetHeight + 34; w = Math.max(w, n.el.offsetWidth); });

      h('li', { html: '<b>Harmonias de Euler:</b> <i>gênero de Euler</i> dá todos os divisores de N = 3^b·5^c·7^d como parciais da fundamental, com a rede (quintas → , terças ↑); <i>série de Euler</i> ordena os gêneros pelo gradus suavitatis; <i>caminho na rede</i> anda por quintas e terças; <i>gradus suavitatis</i> mede qualquer acorde. Use ⅛ de tom na pauta para ver as alturas justas mais de perto.' }),
      h('li', { html: '<b>OMRC</b> (Örjan Sandred): monte o domínio (<i>voice-domain</i>: compassos e células por camada), ligue regras (portas ◇) ao <i>pmc</i> e leia as camadas da solução; <i>decode-engine</i> lê qualquer voz/camada. ↻ pede outra solução (semente).' }),
      h('li', { html: '<b>Tonnetz:</b> escolha os dois intervalos geradores e a forma do acorde; clique nos nós para criar o caminho e use P, L, R para as transformações neo-riemannianas. Com 702 e 386 cents, é a rede justa de Euler.' }),
      h('li', { html: '<b>Reprodução:</b> durante o ▶ um cursor azul percorre a pauta e a rolagem acompanha.' }),
      h('li', { html: '<b>Figuras rítmicas:</b> vozes com compasso aparecem em notação tradicional — semínimas, colcheias com barras de ligação, pausas, pontos, ligaduras e quiálteras com colchete, como na voice do OpenMusic. Vozes sem compasso continuam em notação proporcional.' }),
      h('li', { html: '<b>Métrica:</b> <i>árvore rítmica</i> lê árvores do OpenMusic, como <code>? (((4 4) (1 (1 (1 2 1 1)) 1 1)) ((3 4) (1 -1 1)))</code>, com grupos, pausas negativas e ligaduras (1.0); <i>mktree</i> e <i>compasso</i> encaixam qualquer ritmo em compassos; <i>pulsemaker</i> divide compassos em pulsos. A <i>voz</i> leva os compassos para a partitura (barras e fórmulas) e para o MIDI. Opções → Metrônomo toca os tempos junto.' }),
      h('li', { html: '<b>Ritmo geométrico:</b> <i>euclides</i> gera E(k, n) pelo algoritmo de Bjorklund; <i>polígonos</i> inscreve figuras regulares (3 = triângulo, 4 = quadrado…) num círculo de n pulsos e soma uma figura livre desenhada clicando nos pulsos. As duas saídas ○ (ritmo e posições) alimentam <i>voz</i>, <i>interlock rítmico</i>, <i>filtertree</i> etc.' }),
      h('li', { html: '<b>Profile:</b> biblioteca de Mikhail Malt e Jacopo Baboni Schilingi (IRCAM, 1994) para perfis melódicos: perturbação, mudança de perfil, reflexões, derivação e integração, interpolações. Em Processar → Profile. As curvas (bpf) são listas de valores igualmente espaçados; vazias = linear.' }),
      h('li', { html: '<b>Bibliotecas:</b> menu Bibliotecas. <i>Esquisse</i> completa o eixo espectral (harm-series, nth-harm, freq-mod com a tabela de Bessel, ring-mod, fshift, fdistor) e traz análises (virt-fund, m-vir-fun de Delerue, harm-dist, best-freq) e operações intervalares (best-transp, best-inv, all-inversions). <i>Alea</i> e <i>Chaos</i> geram parâmetros: distribuições com histograma, passeios aleatórios, 1/f, Markov (aprendendo de uma melodia), mapas logísticos, atratores (Lorenz, Rössler, Hénon…) e fractais (IFS, ponto médio, fract-gen); a saída ○ dá os valores crus e a □ a melodia, mapeada entre grave e agudo. Nos fractais, o eixo x pode virar tempo (ataques). <i>OM-JI</i> trabalha com razões: diamante de Partch, sobreposições e médias de Johnston, a rede de Johnston (dois primos quaisquer, com a notação de Johnston), MOS e CPS de Erv Wilson (hexany, eikosany).' }),
      h('li', { html: '<b>RepMus:</b> <i>mutation</i> (transição por pequenos movimentos), <i>autotransp</i> cromática ou espectral, <i>map-chords</i> (refaz um modelo com acordes de um reservatório), <i>chseq->poly</i>/<i>tie-all</i> (notas comuns sustentadas), <i>make-graph + graph-tour</i> (percurso ótimo por notas comuns ou por qualquer intervalo, como mk-pred), a linguagem de crivos <i>lc</i> com crible-list, crible-voice e crible-pitches, <i>rytm-pair</i>, as métricas <i>feuillete</i>, <i>tempo-intp</i> e <i>metric-modulation-ratios</i> (vozes com tempo próprio por compasso) e <i>as->om</i> (parciais do AudioSculpt). O Esquisse ganhou as funções do PatchWork: inter->chord, chord->inter, find-intervals, remove-int, transpoct, mul-chord, auto-transp, exist-note?, midi-center, fm-ratio, ring-harm, fshift-proc, fdistor-proc, l-distor, l*line/l*curb, densifier e min->sec.' }),
      h('li', { html: '<b>Forte e MathTools:</b> o grupo <i>Forte</i> analisa acordes como conjuntos de classes de altura (ordem normal, forma primária e nome de Forte, vetor intervalar, par Z, complementar, simetria), faz Tn, TnI e complemento, lista subconjuntos, relações (sub-rel, similaridade Rp/R0/R1/R2) e complexos K/Kh, e desenha o relógio (n-cercle), que também serve para escrever conjuntos clicando. Os objetos aceitam acordes por cabo ou classes digitadas (0–11, T e E; ; separa conjuntos). A <i>MathTools</i> traz Zn (mod*, estruturas, orbites e famílias tac/tai/tic/ttl/tp/tid, TL-ZN), Lewin (ifunc, injeção), sequências de diferenças finitas, crivos de Xenakis e cânones rítmicos de pavimentação: Vuza, por polinômios ciclotômicos (Amiot), por R e S e aumentados (Noll), com a grade das vozes.' }),
      h('li', { html: '<b>Recombinar:</b> análises (<i>virtual-fund</i>, <i>which-dist</i>, <i>closest-harm</i>) têm saída ○ para realimentar geradores.' }),
      h('li', { html: 'O patch fica guardado neste navegador. Para levá-lo a outro lugar, use Arquivo → Copiar patch.' })),
    h('div', { class: 'acts' }, h('button', { class: 'gb def', text: 'OK', onclick: closeDialog })));
}
